viva:[
['Why three stitches?','The gastroduodenal artery is fed from both ends: from above through the common hepatic, and from below through the pancreaticoduodenal arcades. A stitch cranial and a stitch caudal to the vessel stop both. The medial U-stitch takes the transverse pancreatic branch entering the base. One stitch controls one inflow and the ulcer rebleeds.'],
['Who goes to theatre, who to radiology, and who back to endoscopy?','Lau at the Prince of Wales (1999) randomised rebleeding ulcers after endoscopic control: a second endoscopy gave lasting control in 73%, with fewer complications than surgery (15% against 36%); deaths were not significantly different. Shock and ulcers over 2 cm predicted failure. So: re-scope most; embolise where available; operate on the unstable, the large posterior ulcer, and failed embolisation. WSES operates sooner than ESGE and ACG on the hypotensive or the large ulcer.'],
['Name the pyloroplasties.','Heineke–Mikulicz: longitudinal incision across the pylorus closed transversely, the common one. Finney: a side-to-side gastroduodenostomy with the incision through the pylorus, for a scarred outlet. Jaboulay: a side-to-side gastroduodenostomy that leaves the pylorus intact.'],
['Is there still a place for vagotomy?','Rarely. PPI and H. pylori eradication do the job of acid reduction for most patients, and minimal surgery in old, unstable patients carries less morbidity. Keep it for the patient with refractory or recurrent ulceration despite good compliance, with vagotomy and drainage or antrectomy. WSES notes one database analysis in which vagotomy and drainage had lower mortality, so expect to be asked.'],
['After the bleed, do you restart aspirin?','For secondary prevention, yes, with a PPI, within three to five days. Sung’s trial at the Prince of Wales: continuing aspirin after endoscopic haemostasis doubled 30-day rebleeding (10.3% against 5.4%) but cut 8-week mortality from 12.9% to 1.3%. Stopping aspirin for a stent or a stroke costs lives.'],
['What is a Dieulafoy lesion?','A large-calibre submucosal artery that erodes through a small mucosal defect, usually high on the lesser curve within 6 cm of the cardia. It bleeds briskly and is easy to miss once it stops, because there is no ulcer to see. Treated endoscopically with clips or band ligation; surgically by wedge excision or under-running through a gastrotomy.'],
['The duodenum will not close. What now?','Antrectomy and a Billroth II, with the stump closed by Nissen’s technique (the anterior wall sewn to the pancreatic capsule over the ulcer base), Bancroft’s (antral mucosectomy so the stump is closed above the scar), or a tube duodenostomy as a controlled fistula. A Roux limb anastomosed to the defect is the other option.']
],

P.push({
id:'ogd-haemostasis', name:'OGD and endoscopic haemostasis', aka:'ogd egd gastroscopy upper endoscopy ugib upper gi bleed haematemesis melaena forrest clip adrenaline heater probe hemospray tc-325 otsc',
system:'Endoscopy', list:'both', approach:'Endoscopic',
aim:'See everything from cricopharyngeus to D2, find the lesion, grade it, and leave nothing that will rebleed.',
status:'Draft 0.1 · 18/11/2026 · sourced, not yet tested by you in the endoscopy room',
houseTitle:'Practice and evidence', houseLead:'What the guidelines and the Hong Kong trials say, for the questions that come up on every bleed.', houseHead:['Question','Practice','Evidence'],

steps:[
{t:'Checks', how:'Indication, consent, fasting, antithrombotics noted. In a bleed: resuscitated first, Glasgow-Blatchford score recorded, PPI started, erythromycin 250 mg IV 30–120 minutes before if bleeding is active or severe. Time-out.', why:'Erythromycin empties the stomach of blood, so you can see. An unstable patient is scoped in theatre with an anaesthetist, not in the endoscopy room.', tip:'Check the QTc before erythromycin.'},
{t:'Position and sedation', how:'Left lateral, neck slightly flexed, mouth guard in. Sedation as planned, with oxygen and continuous saturation monitoring. Suction working before the scope goes in.', why:'Left lateral lets secretions drain out of the mouth instead of into the airway. A patient vomiting blood who cannot protect the airway is intubated first.'},
{t:'Intubate', how:'Pass the scope over the tongue in the midline under direct vision, to the upper oesophageal sphincter. Advance gently as the patient swallows.', why:'Blind pushing finds the piriform fossa, the commonest site of perforation in diagnostic endoscopy.', tip:'Ask the patient to swallow as the tip reaches the sphincter. It opens for a second; that is when you advance.'},
{t:'Oesophagus', how:'Insufflate and examine on the way down. Note the Z-line and the diaphragmatic pinch as distances from the incisors. Look for varices.', why:'Varices change the whole pathway: vasoactive drug, antibiotics, banding. Know before you treat anything else.'},
{t:'Stomach and duodenum', how:'Suck the pool, look at the antrum and pylorus, enter D1 and inspect its anterior and posterior walls, then turn right and advance into D2.', why:'Posterior D1 is where the gastroduodenal artery ulcers are; the ampulla on the medial wall of D2 marks the end of the examination.', tip:'In a bleed, clot lies in the fundus with the patient on the left side. Examine the lesser curve, antrum and duodenum first, then tilt the patient to move the clot.'},
{t:'Retroflex', how:'Back in the antrum, retroflex and look at the angulus, lesser curve, cardia and fundus. Straighten and withdraw.', why:'The cardia, the fundus and the high lesser curve are blind spots in the forward view, and that is where Dieulafoy lesions and Cameron erosions hide.'},
{t:'Grade the lesion', how:'Size, site and Forrest class. Treat Ia, Ib and IIa. For IIb, lift the clot and treat what is beneath. No endotherapy for IIc or III.', why:'Treatment is decided by the risk of rebleeding, which the Forrest class predicts.'},
{t:'Haemostasis', how:'Adrenaline 1:10,000 injected around the vessel to slow it, then a second definitive method: clips on the vessel, or a contact thermal probe with firm pressure. Never adrenaline alone.', why:'Dual therapy rebleeds less than injection alone (WSES 2020, 2B). Adrenaline works by tamponade and vasoconstriction, and both wear off.', tip:'Before pushing a device out, advance the catheter once to see where in the image it emerges, and bring the lesion to that spot.'},
{t:'Escalate if needed', how:'Over-the-scope clip for a large ulcer, a large vessel or rebleeding. Haemostatic powder (TC-325) for diffuse or refractory bleeding, as a bridge.', why:'Ulcers over 2 cm, vessels over 2 mm and posterior D1 ulcers fail standard therapy more often. Powder buys time; it does not treat the vessel.'},
{t:'Biopsy', how:'Antral and body biopsies for H. pylori. Biopsy the edge of any gastric ulcer once bleeding has stopped, or plan a repeat endoscopy.', why:'A negative test during a bleed is often false. Every gastric ulcer is a possible cancer until histology says otherwise.'},
{t:'Withdraw', how:'Suck out the air from the stomach and re-inspect the oesophagus on the way out. Photograph the landmarks and the treated lesion.', why:'A distended stomach is uncomfortable and makes vomiting and aspiration more likely in recovery.'}
],
house:[
['How soon?','Within 24 hours of presentation, after resuscitation','High-risk patients within 12 hours (WSES 2020, 1C). Prince of Wales trial in Glasgow-Blatchford 12 or more: endoscopy within 6 hours was not better (30-day death 8.9% against 6.6%).'],
['PPI before endoscopy?','Start it, but do not let it delay the scope','Start as soon as possible (WSES 2B). Prince of Wales trial: reduced the need for endotherapy from 28% to 19%, without changing rebleeding, surgery or death.'],
['Erythromycin?','Before endoscopy in active or severe bleeding','Recommended (WSES 2B).'],
['Which method?','Two methods for active bleeding or a visible vessel','Dual-modality haemostasis (WSES 2B). Adrenaline is never enough alone (ESGE 2021).'],

viva:[
['Give the Forrest classification and what you do with each.','Ia spurting and Ib oozing: treat. IIa non-bleeding visible vessel: treat. IIb adherent clot: lift it and treat beneath, or give high-dose PPI if it will not lift. IIc flat pigmented spot and III clean base: no endotherapy. Untreated rebleeding runs over 50% for class I, over 40% for IIa and over 20% for IIb.'],
['Glasgow-Blatchford or Rockall?','Glasgow-Blatchford before endoscopy, to decide who needs intervention: urea, haemoglobin, systolic pressure, pulse, melaena, syncope, liver disease and heart failure. A score of 0 or 1 can go home for outpatient endoscopy. The full Rockall needs the endoscopic findings and predicts rebleeding and death; AIMS65 predicts death.'],
['How quickly should a bleed be scoped?','Within 24 hours of presentation, once resuscitated. Lau’s Prince of Wales trial (NEJM 2020) randomised high-risk patients, Glasgow-Blatchford 12 or more, to endoscopy within 6 hours or at 6–24 hours: 30-day mortality was 8.9% against 6.6%, not significantly different. Earlier is not better if it means scoping an unresuscitated patient.'],
['Why not adrenaline alone?','It works by volume tamponade and vasoconstriction, and both wear off. Adding a second method, clips or contact thermal, reduces rebleeding, surgery and death compared with injection alone. A single method that treats the vessel itself is comparable to dual therapy.'],
['It rebleeds the next day. What now?','Repeat the endoscopy: in Lau’s 1999 trial it gave lasting control in 73%, with fewer complications than surgery. Shock at rebleeding and ulcers over 2 cm predicted failure; involve the surgeon and radiology early in those. If the second endoscopy fails: embolisation where available, otherwise surgery.'],
['The varices are bleeding. What changes?','Vasoactive drug (terlipressin, somatostatin or octreotide) for 2–5 days and ceftriaxone before endoscopy, band ligation within 12 hours, a restrictive transfusion target of 70–80 g/L, no tranexamic acid, and consideration of TIPS for high-risk or refractory bleeding (Baveno VII).'],
['A patient on aspirin for a coronary stent has a treated ulcer. Do you stop it?','Continue it, or restart within three to five days, with a PPI. Sung’s Prince of Wales trial: continuing aspirin doubled 30-day rebleeding (10.3% against 5.4%) but cut 8-week mortality from 12.9% to 1.3%. Dual antiplatelets: keep the aspirin, restart the second agent within five days.']
],

/* ── helpers ── */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=(n,c='')=>`<svg class="icon ${c}" aria-hidden="true"><use href="#ph-${n}"/></svg>`;
const ul=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
const num=s=>esc(s).replace(/(\d[\d.,–]*%?)/g,'<span class="mono">$1</span>');
const noteHTML=t=>t.split('\n').map(l=>l.trim()===''?'<span class="gap"></span>':`<span class="l">${esc(l).replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>').replace(/\{\{(.+?)\}\}/g,'<span class="sf">$1</span>')}</span>`).join('');
const noteText=t=>t.replace(/\[\[|\]\]|\{\{|\}\}/g,'');
const srcs=a=>a&&a.length?`<details class="acc src"><summary><span>Sources (<span class="mono">${a.length}</span>)</span>${ic('caret-down','sm')}</summary><div class="acc-body"><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></div></details>`:'';
const NOTES={};
function noteBlock(title,text,bare){const k='n'+Object.keys(NOTES).length;NOTES[k]=noteText(text);return `<div class="notehd"${bare?' style="margin-top:0"':''}>${bare?'<span class="caption">Replacement lines</span>':`<h4>${esc(title)}</h4>`}<button class="btn btn-ghost sm" data-copy="${k}">${ic('copy','sm')}Copy</button></div><div class="notebox">${noteHTML(text)}</div>`;}
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ── state ── */
let filter='all', query='', tab='steps';
const LIST={emergency:'Emergency',elective:'Elective',both:'Elective and emergency'};
const TABS=[['steps','Steps'],['anatomy','Anatomy'],['pitfalls','Pitfalls'],['setup','Set-up'],['consent','Consent'],['notes','Post-op note'],['viva','Viva']];

/* ── home ── */
function home(){
  $('#back').hidden=true; document.title='HST Atlas — EDB';
  $('#app').innerHTML=`<div class="hero"><span class="tag">General surgery · Hong Kong</span><h1>Operative atlas</h1><p>Read it before the case. Write the note from it afterwards.</p></div>
  <div class="searchrow">${ic('magnifying-glass')}<input class="input" id="q" type="search" placeholder="Search a procedure" aria-label="Search a procedure" value="${esc(query)}"></div>
  <div class="segmented flush" role="group" aria-label="List">${[['all','All'],['emergency','Emergency'],['elective','Elective']].map(([k,l])=>`<button data-list="${k}" class="${filter===k?'active':''}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div>
  <div id="list"></div>`;
  $('#q').addEventListener('input',e=>{query=e.target.value;list();});
  $$('[data-list]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.list;$$('[data-list]').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',on)});list();}));
  list();
}
function list(){
  const q=query.trim().toLowerCase();
  const hit=(name,aka,l)=>(filter==='all'||l===filter||l==='both')&&(!q||(name+' '+(aka||'')).toLowerCase().includes(q));
  const ready=P.filter(p=>hit(p.name,p.aka,p.list)), soon=[];
  let h='';
  const bySys={}; ready.forEach(p=>(bySys[p.system]=bySys[p.system]||[]).push(p));
  Object.keys(bySys).forEach(s=>{h+=`<div class="sys"><span class="tag">${esc(s)}</span>${bySys[s].map(p=>`<a class="prow" href="#${p.id}"><span><span class="nm">${esc(p.name)}</span><span class="mt">${LIST[p.list]} · ${esc(p.approach)}</span></span>${ic('caret-right')}</a>`).join('')}</div>`;});
  if(soon.length) h+=`<div class="sys"><span class="tag">Batch one · in preparation</span>${soon.map(s=>`<div class="prow soon"><span><span class="nm">${esc(s[0])}</span><span class="mt">${esc(s[1])} · ${s[2]==='emergency'?'Emergency':'Elective'}</span></span></div>`).join('')}</div>`;
  if(!ready.length&&!soon.length) h=`<div class="empty"><span class="tag">Nothing here yet</span>No procedure matches. Clear the search or switch list.</div>`;
  $('#list').innerHTML=h;
}

/* ── procedure ── */

  <details class="acc" style="margin-top:var(--space-6)"><summary>${esc(p.houseTitle||'House and evidence')}${ic('caret-down','sm')}</summary><div class="acc-body"><p style="margin:0 0 var(--space-2)">${esc(p.houseLead||'Do it the consultant’s way. Know what the guideline says when asked.')}</p><div class="table-wrap"><table class="t"><thead><tr>${(p.houseHead||['Step','House','Guideline']).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${p.house.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${num(r[2])}</td></tr>`).join('')}</tbody></table></div></div></details>${srcs(s.steps)}`;
  const a=p.anatomy;
  const T=a.table;
  const anatomy=`${p.dg&&p.dg.anat||''}<h3>What matters</h3>${ul(a.points)}
  ${T?`<h3>${esc(T.title)}</h3><div class="table-wrap"><table class="t"><thead><tr>${T.head.map((h,i)=>`<th${T.num!=null&&i===T.num?' class="n"':''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${T.rows.map(r=>`<tr>${r.map((c,i)=>`<td${T.num!=null&&i===T.num?' class="n"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
  <h3>Danger zones</h3>${ul(a.danger)}${srcs(s.anatomy)}`;

  ${p.pitfalls.map(x=>`<div class="pit"><h4>${esc(x.t)}${x.u?` <span class="unc">· ${esc(x.u)}</span>`:''}</h4><p class="kv"><b>Avoid.</b> ${esc(x.a)}</p><p class="kv"><b>Rescue.</b> ${num(x.r)}</p></div>`).join('')}
  <h3>Stop and call</h3><p class="lead">In the note this reads “senior kindly scrubbed in”. In theatre it reads as judgement.</p>${ul(p.call)}${srcs(s.pitfalls)}`;
  const u=p.setup;
  const setup=`${p.dg&&p.dg.setup||''}<h3>Theatre</h3>${ul(u.theatre)}<h3>Ask for</h3>${ul(u.kit)}<h3>Have in the room</h3>${ul(u.standby)}${srcs(s.setup)}`;
  const c=p.consent;
  const consent=`<p class="legend"><span class="hl">Shaded</span> text changes with the patient. Type it into CMS as the record of what you discussed.</p>${noteBlock('Consent discussion',c.note)}
  <h3>Figures to quote</h3><div class="table-wrap"><table class="t"><thead><tr><th>Risk</th><th class="n">Rate</th><th>Source</th></tr></thead><tbody>${c.figures.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>${c.versus?`<p class="kv">${num(c.versus)}</p>`:''}${srcs(s.consent)}`;
  const n=p.notes;
  const notes=`<p class="legend"><span class="hl">Shaded</span>: amend to the case. <span class="sf">Dotted underline</span>: a safety claim, true only if you did it.</p>
  ${noteBlock('Findings',n.findings)}${noteBlock('Procedure record',n.procedure)}
  <h3>Decision lines</h3><p class="lead">Swap one in where you made the choice.</p>${n.decisions.map(d=>noteBlock(d[0],d[1])).join('')}
  <h3>When it did not go to plan</h3><p class="lead">Replace the matching lines of the record. What happened, what you did, who came.</p>${n.deviations.map(d=>`<details class="acc"><summary>${esc(d[0])}${ic('caret-down','sm')}</summary><div class="acc-body" style="color:var(--text)">${noteBlock(d[0],d[1],true)}</div></details>`).join('')}
  <h3>Orders</h3>${noteBlock('Post-op orders',n.postop)}${noteBlock('Discharge and follow-up',n.discharge)}${srcs(s.notes)}`;
  const viva=`<p class="lead">What a senior asks across the table, and an examiner asks across a desk. Answer aloud before you open one.</p>${p.viva.map(v=>`<details class="acc qa"><summary>${esc(v[0])}${ic('caret-down','sm')}</summary><div class="acc-body">${num(v[1])}${v[2]?` <span class="unc">· ${esc(v[2])}</span>`:''}</div></details>`).join('')}${srcs(s.viva)}`;
  return {steps,anatomy,pitfalls,setup,consent,notes,viva};
}
let cur=null;
function proc(p){
  cur=p; $('#back').hidden=false; document.title=p.name+' — HST Atlas';
  for(const k in NOTES) delete NOTES[k];
  const pn=panes(p);
  $('#app').innerHTML=`<div class="phead"><div class="meta"><span class="pill ${p.list==='emergency'?'pill-warning':'pill-ocean'}">${LIST[p.list]}</span><span class="pill pill-ocean">${esc(p.approach)}</span></div><h1>${esc(p.name)}</h1><p class="aim">${esc(p.aim)}</p><p class="status">${num(p.status)}</p></div>
  <div class="tabs sticky" role="tablist" aria-label="Sections">${TABS.map(([k,l])=>`<button class="tab" role="tab" id="t-${k}" data-tab="${k}" aria-controls="p-${k}">${l}</button>`).join('')}</div>
  ${TABS.map(([k])=>`<div class="pane" role="tabpanel" id="p-${k}" aria-labelledby="t-${k}" hidden>${pn[k]}</div>`).join('')}
  <p class="disclaimer">Decision support only — verify against local protocols. No patient-identifiable data.</p>`;
  setTab(tab,false);
  $$('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab,true)));
}
function setTab(k,scroll){
  tab=k;
  $$('.tab').forEach(b=>{const on=b.dataset.tab===k;b.classList.toggle('active',on);b.setAttribute('aria-selected',on);if(on&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'});});
  $$('.pane').forEach(x=>x.hidden=x.id!=='p-'+k);
  if(scroll){const t=$('.tabs.sticky'),top=t.getBoundingClientRect().top+window.scrollY-$('#topbar').offsetHeight;if(window.scrollY>top)window.scrollTo(0,top);}
}

/* ── copy, toast ── */
let tt;
function toast(msg,kind){$$('.toast').forEach(x=>x.remove());const el=document.createElement('div');el.className='toast '+(kind||'');el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);clearTimeout(tt);tt=setTimeout(()=>el.remove(),3500);}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]'); if(!b) return;
  const text=NOTES[b.dataset.copy]||'', fail=()=>toast('Copy was blocked here. Press and hold the text to select it.','warn');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast('Copied without the markers.','ok'),fail); else fail(); }catch(err){ fail(); }
});

/* ── router ── */
function route(){
  const id=(location.hash||'').replace('#','');
  const p=P.find(x=>x.id===id);
  if(p){ proc(p); } else { home(); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{tab='steps';route();});
function fit(){document.documentElement.style.setProperty('--tabtop',$('#topbar').offsetHeight+'px');}
window.addEventListener('resize',fit);

/* ── settings menu and theme ── */
const gear=$('#gear'), menu=$('#menu');
function setMenu(o){menu.hidden=!o;gear.setAttribute('aria-expanded',String(o));}
gear.addEventListener('click',e=>{e.stopPropagation();setMenu(menu.hidden);});
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target))setMenu(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){setMenu(false);gear.focus();}});
function mode(){const t=document.documentElement.getAttribute('data-theme');return t==='light'||t==='dark'?t:'system';}
function paintMode(){const m=mode();$$('.menu .segmented button').forEach(b=>{const on=b.dataset.mode===m;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});}
$$('.menu .segmented button').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.mode;if(m==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m);try{localStorage.setItem('edb-theme',m)}catch(e){}paintMode();}));
paintMode(); fit(); route();
</script>
</body>
