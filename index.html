P.push({
id:'perforated-peptic-ulcer', team:'EGI', name:'Repair of perforated peptic ulcer', aka:'ppu perforated duodenal ulcer perforated gastric ulcer graham patch omental patch omentopexy perforation hollow viscus pneumoperitoneum peritonitis',
system:'Upper GI', list:'emergency', approach:'Laparoscopic, or open',
aim:'Close the hole, clear the soiling, take tissue from any gastric ulcer, and get out. The operation is short; the sepsis is the disease.',
status:'Draft 0.1 · 18/11/2026 · sourced, not yet tested by you in theatre',

steps:[
{t:'Checks and position', how:'WHO checklist. Rapid-sequence general anaesthesia. Ryle’s tube and urinary catheter in. Antibiotics running. Modified Lloyd-Davies position, legs apart.', why:'The surgeon stands between the legs and looks straight up at the pylorus. The Ryle’s tube decompresses the stomach now and inflates it for the leak test later.'},
{t:'Access', how:'Supraumbilical vertical incision, linea alba split, peritoneum opened under vision. Hasson port. Carbon dioxide to 12 mmHg.', why:'Supraumbilical sits closer to the target, and the incision extends straight into an upper midline laparotomy if you convert.'},
{t:'Working ports', how:'10 mm left upper quadrant and 5 mm right upper quadrant ports under laparoscopic vision.', why:'From between the legs these become the right and left hands, triangulating on the pylorus.', tip:'If the liver edge falls over the duodenum, add a 5 mm epigastric port and lift it with a grasper rather than fighting it for the whole case.'},
{t:'Sample and survey', how:'Aspirate fluid and send it for bacterial and fungal culture. Lift the liver edge. Follow the fibrin and bile staining to the anterior pylorus and D1.', why:'Cultures guide the antibiotics (WSES 2020, 1C). Fibrin plaques cluster over the hole.', tip:'Not where you expected? Look along the lesser curve, then open the gastrocolic ligament for a posterior gastric ulcer. Free gas is not always an ulcer.'},
{t:'Decide', how:'Measure the hole, note the side of the pylorus it lies on, and feel the edge with an instrument: soft, indurated, or friable.', why:'Under 2 cm, primary repair. Over 2 cm, or a gastric ulcer that looks malignant, is a different operation. An unstable patient is converted.'},
{t:'Biopsy a gastric ulcer', how:'Gastric ulcer only: take biopsies from the rim before closing, or excise it if the site allows.', why:'10–16% of perforated gastric ulcers are cancers. The rim is lost once it is inside the closure.'},
{t:'Close', how:'Interrupted 3-0 Vicryl, full thickness through the anterior wall, about 5 mm back from the edge, placed along the long axis of the duodenum so the closure lies across it. Tie gently. Leave the tails long.', why:'A transverse closure does not narrow the outlet. Bites well back from the edge hold in oedematous tissue that tears at the margin.', tip:'Place every stitch before tying any. Each bite is easier to see while the hole is still open.'},
{t:'Omental patch', how:'Choose a tongue of omentum that reaches without tension. Lay it over the closure and tie the long tails loosely over it.', why:'It seals small gaps and supports friable edges. Tied tight it necroses.', tip:'If the tongue has to be pulled to reach, it will pull off when the stomach fills. Choose another.'},
{t:'Leak test', how:'Fill the right upper quadrant with saline, inflate the stomach with air through the Ryle’s tube, and watch for bubbles.', why:'A leak found now costs one more stitch. Found on day 4 it costs a relook.', tip:'Pinch D2 gently with a grasper so the air pressurises the repair instead of running down the duodenum.'},
{t:'Lavage', how:'Warm saline until the return is clear, then suck dry: right and left subphrenic spaces, Morison’s pouch, both gutters and the pelvis.', why:'Contamination collects in the dependent spaces. Any residue becomes an abscess.'},
{t:'Drains', how:'House practice: tubal drain via the left upper quadrant port to the pelvis, and via the right upper quadrant port to Morison’s pouch, each anchored with 2-0 Nylon.', why:'See “House and evidence” below. The guideline does not address drains.'},
{t:'Close', how:'Ports out under vision. Fascia with 2-0 Vicryl at the 10 mm sites, skin with 3-0 Ethilon. Local anaesthetic to the wounds. Counts confirmed. Biopsies and cultures labelled.', why:'Watching the ports come out is the only chance to see an abdominal wall bleeder.'}
],

['Gastric ulcer','Biopsy','Resect a large gastric ulcer when malignancy is suspected, with frozen section if available (2D).'],

['Antibiotics','Unit regimen','Broad spectrum (1C). Culture for bacteria and fungi (1C). Stop at 3–5 days or when markers settle (2C).'],

anatomy:{
points:[
'D1: the first 5 cm of the duodenum. The first 2–3 cm, the bulb, is intraperitoneal and mobile. Anterior bulb ulcers perforate into the peritoneal cavity; posterior ones erode the gastroduodenal artery and bleed.',
'Pylorus: a thick ring under the finger, crossed on its front by the pyloric vein of Mayo. Proximal to it the ulcer is gastric and needs tissue; distal to it, duodenal.',
'Posterior gastric wall: a perforation here leaks into the lesser sac and is seen only after opening the gastrocolic ligament.',
'Omentum: pedicled tongues from the right side of the greater omentum, on the right gastroepiploic arcade, reach the pylorus without tension.',
'Spread: gastric contents run down the right paracolic gutter, so the pain can settle in the right iliac fossa and mimic appendicitis (Valentino’s appendix).'
],
table:{title:'Gastric ulcer site: modified Johnson', head:['Type','Site','Acid','Emergency option'], rows:[
['I','Lesser curve at the incisura','Normal or low','Wedge excision usually feasible'],
['II','Body, with a duodenal ulcer','High','Repair and biopsy; look for the duodenal ulcer'],
['III','Prepyloric','High','Behaves as duodenal; excision can narrow the outlet'],
['IV','High lesser curve, near the cardia','Low','Biopsy and patch; excision threatens the cardia'],
['V','Anywhere','Variable','Drug-induced (NSAID, aspirin); repair and biopsy']
]},
danger:[
'Posterior duodenal wall: a bite that crosses the lumen catches it and closes the duodenum.',
'Pylorus: a long closure along the axis narrows the outlet.',
'Gallbladder and bile duct: often stuck to the duodenum over a perforation. Adhesiolysis here is where the duct is injured.',
'Middle colic vessels: in the transverse mesocolon, close by when an omental tongue is freed from the colon.'
]
},

pitfalls:[
{t:'Cannot find the perforation', a:'Systematic survey: anterior pylorus and D1, lesser curve, then the lesser sac.', r:'Not found laparoscopically: convert. Still not found: think of other causes of free gas (colon, small bowel, diverticulum) and call.'},
{t:'Perforation 2 cm or larger', a:'Measure before you stitch. Do not keep suturing into tissue that will not hold.', r:'Omental plug, jejunal serosal patch, resection with the ampulla clear, or pyloric exclusion; duodenostomy only in extreme circumstances (WSES 2D). A senior decision: call.'},
{t:'Looks malignant', a:'Biopsy every gastric perforation. Suspect cancer with a hard rim, a mass, or nodes.', r:'Stable, little soiling, right surgeon present: resection may be done now. Otherwise close, biopsy, stage, and resect later. Call.'},
{t:'Sutures cut through', a:'Bites well back from the edge; tie to approximate, not to strangle.', r:'Lay omentum into the hole and tie the stitches over it without closing the defect first. The omentum is the seal.'},
{t:'Outlet narrowed', a:'Close across the axis; keep bites short.', r:'If the pylorus will not admit a finger at the end, call: a pyloroplasty or gastrojejunostomy may be needed.'},
{t:'Leak test positive', a:'Test every repair before leaving.', r:'Another stitch at the leaking point, re-secure the omentum, and test again.'},
{t:'Unstable on the table', a:'Pneumoperitoneum lowers venous return in a septic patient.', r:'Desufflate and convert (WSES 1D). In septic shock with deranged physiology: damage control — close quickly, lavage, drain, temporary closure, relook (2D).'},
{t:'Bleeding as well as perforation', a:'An anterior perforation can sit opposite a posterior bleeding ulcer.', r:'Fresh blood from the duodenum, or haematemesis after repair: suspect a kissing ulcer. Call.'},
{t:'Adhesions to the gallbladder', a:'Blunt and sharp dissection on the duodenum, not on the gallbladder.', r:'Bile in the field that is not from the ulcer: stop and call.'}
],

viva:[
['Is it a Graham patch?','Strictly, rarely. Cellan-Jones (1929) used a pedicled strand of omentum; Graham (1937) used a free omental graft tied down with three sutures. Neither closed the hole first. Closing the perforation and then tying the tails over pedicled omentum is a modified Graham repair, which is what most of us do and still call a Graham patch.'],
['What is the Boey score?','One point each for major medical illness, shock before operation, and perforation over 24 hours. Boey’s Queen Mary series of 259 duodenal perforations gave mortality of 0%, 10%, 45.5% and 100% for scores 0 to 3. It was derived in duodenal ulcers. PULP, from a Danish national cohort, discriminates better (area under the curve 0.83 against 0.70).'],
['Who can be managed without an operation?','Crofts at the Prince of Wales randomised 83 patients in 1989: mortality was similar, but 28% of the non-operative arm needed surgery at 12 hours, two of them for perforated gastric cancer, and patients over 70 responded less well. WSES 2020 does not recommend it routinely; only in highly selected patients whose perforation is sealed on water-soluble contrast.'],
['Why does a gastric perforation change the operation?','Cancer, size and site. 10–16% are malignant, so the rim is biopsied or excised. Site sets what is possible: an incisural ulcer can be wedged, a prepyloric excision narrows the outlet, and a high lesser-curve ulcer near the cardia is biopsied and patched. Over 2 cm, or suspicious, it is resected with frozen section where feasible.'],
['A 3 cm duodenal perforation: your options?','Not a patch. WSES 2020 tailors it to location: resection or repair, with or without pyloric exclusion and external biliary drainage, duodenostomy only in extremis. In practice: omental plug, jejunal serosal patch, antrectomy with resection of D1 if the ampulla is clear, or pyloric exclusion with gastrojejunostomy. For a stump that will not close: Nissen’s closure to the pancreatic capsule, Bancroft’s antral mucosectomy, or a tube duodenostomy as a controlled fistula.'],
['What is the most important part of the treatment after discharge?','Eradicating H. pylori. In Ng’s Prince of Wales trial of perforated duodenal ulcers, 81% were H. pylori positive, and ulcer relapse at one year fell from 38.1% with omeprazole alone to 4.8% after eradication. Add stopping NSAIDs, eight weeks of PPI, and endoscopy at six to eight weeks for a gastric ulcer.'],
['Day 4: tachycardia, fever, bile in the drain.','A leak until proven otherwise. Resuscitate, image, and grade it. Contained collection: percutaneous drainage, nil by mouth, acid suppression, antibiotics. Controlled through the drain: treat as a fistula. Free leak with peritonitis: relook, knowing that re-suturing inflamed tissue rarely holds, so resection or a tube through the defect may be needed. Too unwell for theatre: endoscopic stent or clip with drainage, from case series only.','expert opinion, no trials']
],

id:'bleeding-duodenal-ulcer', team:'EGI', name:'Under-running of bleeding duodenal ulcer', aka:'bleeding peptic ulcer gda gastroduodenal artery underrun under-run duodenotomy pyloroduodenotomy heineke mikulicz pyloroplasty ugib upper gi bleed rebleed laparotomy',
system:'Upper GI', list:'emergency', approach:'Open',
aim:'Stop the gastroduodenal artery with three stitches, without catching the bile duct, and close the duodenum without narrowing it.',
status:'Draft 0.1 · 18/11/2026 · sourced, not yet tested by you in theatre',

steps:[
{t:'Before the knife', how:'Read the endoscopy report: ulcer site, size and Forrest grade. Blood and products in the room, massive transfusion protocol ready. Arterial line, two large-bore cannulae, Ryle’s tube, urinary catheter. Rapid-sequence general anaesthesia, supine.', why:'The report tells you where to open. Most patients reaching theatre have bled twice and are old; the anaesthetist needs to be ahead of the next bleed.', tip:'Ask for the endoscope to be in theatre. If the ulcer is not where the report says, on-table endoscopy finds it faster than you will.'},
{t:'Incision', how:'Upper midline laparotomy. Self-retaining retractor, liver lifted.', why:'Fast access to stomach and duodenum, extendable downwards.'},
{t:'Kocherise', how:'Divide the peritoneum lateral to D2 and lift the duodenum and head of pancreas forwards and medially.', why:'A hand behind D1 and D2 compresses the ulcer against your fingers while you set up, and it takes tension off the closure later.', tip:'Once Kocherised, a hand behind the duodenum is a tourniquet. Use it while the anaesthetist catches up.'},
{t:'Mark the pylorus', how:'Find the pylorus by feel and by the pyloric vein of Mayo. Place stay sutures on either side of the line you will open.', why:'The incision has to cross the pylorus to reach posterior D1 and to close as a pyloroplasty.'},
{t:'Pyloroduodenotomy', how:'Longitudinal incision across the pylorus onto anterior D1, about 4–5 cm. Suck out the clot. Finger on the bleeding point.', why:'Posterior D1, where the gastroduodenal artery ulcers sit, is directly behind this incision.', tip:'No bleeding point in D1? Extend onto the antrum and look at the stomach, or scope on the table.'},
{t:'Under-run the artery', how:'Heavy non-absorbable suture on a stout round-bodied needle: one stitch cranial and one caudal to the vessel in the ulcer base, then a U-stitch on the medial side.', why:'The gastroduodenal artery fills from above and, through the pancreaticoduodenal arcades, from below. The medial U-stitch takes the transverse pancreatic branch. One stitch stops one inflow.', tip:'Keep the bites in the ulcer base and away from its lateral side. The bile duct runs just to the right of the artery.'},
{t:'Check', how:'Release the finger and the hand behind. Ask the anaesthetist to let the pressure come up. Look for bleeding and for bile in the ulcer base.', why:'A stitch tested at a systolic of 80 has not been tested. Bile in the base means the duct has been caught or opened.', tip:'Take an antral biopsy for H. pylori through the opening. Testing after a bleed is often falsely negative; tissue in a pot now is worth having.'},
{t:'Close as a pyloroplasty', how:'Pull the stay sutures apart so the longitudinal incision becomes a transverse line. Close it transversely, Heineke–Mikulicz, with interrupted 3-0 PDS.', why:'A transverse closure widens the outlet instead of narrowing it.'},
{t:'Wash and drain', how:'Irrigate with warm saline and suck dry. House drain to the subhepatic space.', why:'Blood in the peritoneum is a culture medium, and a drain there will show bile or blood early.'},
{t:'Close', how:'Mass closure with a PDS loop, skin with staples. Counts confirmed. Record blood loss and units transfused.', why:'These patients are old, anaemic and on steroids or antithrombotics more often than not: the abdominal wall has to hold through a long ileus.'}
],
house:[
['When to operate','After endoscopy fails','After repeated endoscopic failure (WSES 2020, 1D). WSES also operates without a second endoscopy if hypotensive or the ulcer is over 2 cm (1D); ESGE and ACG repeat endoscopy, then embolise.'],
['Embolisation','Depends on availability','An alternative where available (2D). Prince of Wales: rebleeding 34% after embolisation against 13% after surgery; death 25% against 30%, not significant.'],
['Locating the bleed','Duodenotomy guided by the report','Intra-operative endoscopy to locate the source (2D).'],
['Operation','Under-run and pyloroplasty','Choose by location, size and vessel (2C). Triple ligation of the gastroduodenal artery.'],
['Acid surgery','Not added','Under-running plus PPI and H. pylori eradication is the norm. WSES cites one database analysis in which vagotomy and drainage had lower mortality.'],
['After surgery','High-dose PPI','High-dose PPI infusion for 72 hours (2B), then 6–8 weeks of PPI (1B).']
],

anatomy:{
points:[
'Gastroduodenal artery: from the common hepatic artery, it descends behind D1 between the duodenum and the neck of the pancreas, then divides into the right gastroepiploic and superior pancreaticoduodenal arteries.',
'Two-way inflow: from above through the common hepatic, and from below through the pancreaticoduodenal arcades from the superior mesenteric. Hence a stitch above and a stitch below.',
'Transverse pancreatic branch: enters the ulcer base from the medial side. Hence the U-stitch.',
'Common bile duct: runs behind D1 to the right of the gastroduodenal artery, then through the head of the pancreas to the ampulla on the medial wall of D2.',
'Left gastric artery: supplies the lesser curve. High lesser-curve ulcers and Dieulafoy lesions bleed from its branches.'
],
table:{title:'Where it bleeds from', head:['Ulcer','Vessel','Operation'], rows:[
['Posterior D1','Gastroduodenal artery','Pyloroduodenotomy, three-point under-running, Heineke–Mikulicz closure'],
['Lesser curve, incisura','Left or right gastric branches','Wedge excision, or biopsy and under-running'],
['Distal lesser curve, antrum','Right gastric branches','Distal gastrectomy if excision is not possible'],
['High lesser curve, near the cardia','Left gastric','Gastrotomy, biopsy, oversew from inside'],
['Body or greater curve','Gastroepiploic or short gastric','Wedge excision']
]},
danger:[
'Common bile duct: deep or lateral bites in the ulcer base. Bile in the base or jaundice afterwards gives it away.',
'Pancreas and pancreatic duct: the base of a penetrating posterior ulcer is pancreas. Do not excise it; under-run it.',
'Ampulla: on the medial wall of D2. Matters if the incision extends down or D1 is resected.',
'Inferior vena cava: directly behind the duodenum during Kocherisation. Stay on the front of it.'
]
},

pitfalls:[
{t:'No bleeding point in D1', a:'Read the report; open where it says.', r:'Look at the stomach through an extended incision, or scope on the table. Consider a Dieulafoy lesion high on the lesser curve, a Mallory–Weiss tear, or varices.'},
{t:'Field full of blood', a:'Kocherise first so a hand can compress from behind.', r:'Finger in the ulcer, two suckers, wait for the anaesthetist. Then place the stitches one at a time under vision.'},
{t:'One stitch, then rebleeding', a:'Three points every time: cranial, caudal, medial U-stitch.', r:'Rebleeding after surgery: embolisation, or relook. Call.'},
{t:'Bile in the ulcer base', a:'Bites in the ulcer base, not lateral to it.', r:'Stop and call. The duct may need a cholangiogram and a T-tube, done by a senior.'},
{t:'Giant penetrating ulcer', a:'Expect it when the endoscopy shows an ulcer over 2 cm on the posterior wall.', r:'Under-run the base and leave it on the pancreas. If the duodenum cannot be closed, a distal gastrectomy with a difficult-stump closure (Nissen’s, Bancroft’s, or a tube duodenostomy). A senior decision.'},
{t:'Outlet narrowed or closure under tension', a:'Kocherise fully; close transversely.', r:'If it will not close without tension, call: a gastrojejunostomy or resection may be safer.'},
{t:'Coagulopathic and cold', a:'Massive transfusion protocol with plasma, platelets, calcium and warming from the start.', r:'Damage control in haemorrhagic shock with deranged physiology (WSES 2D): stitches, pack, temporary closure, ICU, relook.'},
{t:'Gastric ulcer, not duodenal', a:'Every bleeding gastric ulcer is a possible cancer.', r:'Excise it, or biopsy it and under-run (WSES 2C).'}
],

viva:[
['Why three stitches?','The gastroduodenal artery is fed from both ends: from above through the common hepatic, and from below through the pancreaticoduodenal arcades. A stitch cranial and a stitch caudal to the vessel stop both. The medial U-stitch takes the transverse pancreatic branch entering the base. One stitch controls one inflow and the ulcer rebleeds.'],
['Who goes to theatre, who to radiology, and who back to endoscopy?','Lau at the Prince of Wales (1999) randomised rebleeding ulcers after endoscopic control: a second endoscopy gave lasting control in 73%, with fewer complications than surgery (15% against 36%); deaths were not significantly different. Shock and ulcers over 2 cm predicted failure. So: re-scope most; embolise where available; operate on the unstable, the large posterior ulcer, and failed embolisation. WSES operates sooner than ESGE and ACG on the hypotensive or the large ulcer.'],
['Name the pyloroplasties.','Heineke–Mikulicz: longitudinal incision across the pylorus closed transversely, the common one. Finney: a side-to-side gastroduodenostomy with the incision through the pylorus, for a scarred outlet. Jaboulay: a side-to-side gastroduodenostomy that leaves the pylorus intact.'],
['Is there still a place for vagotomy?','Rarely. PPI and H. pylori eradication do the job of acid reduction for most patients, and minimal surgery in old, unstable patients carries less morbidity. Keep it for the patient with refractory or recurrent ulceration despite good compliance, with vagotomy and drainage or antrectomy. WSES notes one database analysis in which vagotomy and drainage had lower mortality, so expect to be asked.'],
['After the bleed, do you restart aspirin?','For secondary prevention, yes, with a PPI, within three to five days. Sung’s trial at the Prince of Wales: continuing aspirin after endoscopic haemostasis doubled 30-day rebleeding (10.3% against 5.4%) but cut 8-week mortality from 12.9% to 1.3%. Stopping aspirin for a stent or a stroke costs lives.'],
['What is a Dieulafoy lesion?','A large-calibre submucosal artery that erodes through a small mucosal defect, usually high on the lesser curve within 6 cm of the cardia. It bleeds briskly and is easy to miss once it stops, because there is no ulcer to see. Treated endoscopically with clips or band ligation; surgically by wedge excision or under-running through a gastrotomy.'],
['The duodenum will not close. What now?','Antrectomy and a Billroth II, with the stump closed by Nissen’s technique (the anterior wall sewn to the pancreatic capsule over the ulcer base), Bancroft’s (antral mucosectomy so the stump is closed above the scar), or a tube duodenostomy as a controlled fistula. A Roux limb anastomosed to the defect is the other option.']
],

P.push({
id:'ogd-haemostasis', team:'EGI', name:'OGD and endoscopic haemostasis', aka:'ogd egd gastroscopy upper endoscopy ugib upper gi bleed haematemesis melaena forrest clip adrenaline heater probe hemospray tc-325 otsc',
system:'Endoscopy', list:'both', approach:'Endoscopic',
aim:'See everything from cricopharyngeus to D2, find the lesion, grade it, and leave nothing that will rebleed.',
status:'Draft 0.1 · 18/11/2026 · sourced, not yet tested by you in the endoscopy room',
houseTitle:'Practice and evidence', houseLead:'What the guidelines and the Hong Kong trials say, for the questions that come up on every bleed.', houseHead:['Question','Practice','Evidence'],

steps:[
{t:'Checks', how:'Indication, consent, fasting, antithrombotics noted. In a bleed: resuscitated first, Glasgow-Blatchford score recorded, PPI started, erythromycin 250 mg IV 30–120 minutes before if bleeding is active or severe. Time-out.', why:'Erythromycin empties the stomach of blood, so you can see. An unstable patient is scoped in theatre with an anaesthetist, not in the endoscopy room.', tip:'Check the QTc before erythromycin.'},
{t:'Position and sedation', how:'Left lateral, neck slightly flexed, mouth guard in. Sedation as planned, with oxygen and continuous saturation monitoring. Suction working before the scope goes in.', why:'Left lateral lets secretions drain out of the mouth instead of into the airway. A patient vomiting blood who cannot protect the airway is intubated first.'},
{t:'Intubate', how:'Pass the scope over the tongue in the midline under direct vision, to the upper oesophageal sphincter. Advance gently as the patient swallows.', why:'Blind pushing finds the piriform fossa, the commonest site of perforation in diagnostic endoscopy.', tip:'Ask the patient to swallow as the tip reaches the sphincter. It opens for a second; that is when you advance.'},
{t:'Oesophagus', how:'Insufflate and examine on the way down. Note the Z-line and the diaphragmatic pinch as distances from the incisors. Look for varices.', why:'Varices change the whole pathway: vasoactive drug, antibiotics, banding. Know before you treat anything else.'},
{t:'Stomach and duodenum', how:'Suck the pool, look at the antrum and pylorus, enter D1 and inspect its anterior and posterior walls, then turn right and advance into D2.', why:'Posterior D1 is where the gastroduodenal artery ulcers are; the ampulla on the medial wall of D2 marks the end of the examination.', tip:'In a bleed, clot lies in the fundus with the patient on the left side. Examine the lesser curve, antrum and duodenum first, then tilt the patient to move the clot.'},
{t:'Retroflex', how:'Back in the antrum, retroflex and look at the angulus, lesser curve, cardia and fundus. Straighten and withdraw.', why:'The cardia, the fundus and the high lesser curve are blind spots in the forward view, and that is where Dieulafoy lesions and Cameron erosions hide.'},
{t:'Grade the lesion', how:'Size, site and Forrest class. Treat Ia, Ib and IIa. For IIb, lift the clot and treat what is beneath. No endotherapy for IIc or III.', why:'Treatment is decided by the risk of rebleeding, which the Forrest class predicts.'},
{t:'Haemostasis', how:'Adrenaline 1:10,000 injected around the vessel to slow it, then a second definitive method: clips on the vessel, or a contact thermal probe with firm pressure. Never adrenaline alone.', why:'Dual therapy rebleeds less than injection alone (WSES 2020, 2B). Adrenaline works by tamponade and vasoconstriction, and both wear off.', tip:'Before pushing a device out, advance the catheter once to see where in the image it emerges, and bring the lesion to that spot.'},
{t:'Escalate if needed', how:'Over-the-scope clip for a large ulcer, a large vessel or rebleeding. Haemostatic powder (TC-325) for diffuse or refractory bleeding, as a bridge.', why:'Ulcers over 2 cm, vessels over 2 mm and posterior D1 ulcers fail standard therapy more often. Powder buys time; it does not treat the vessel.'},
{t:'Biopsy', how:'Antral and body biopsies for H. pylori. Biopsy the edge of any gastric ulcer once bleeding has stopped, or plan a repeat endoscopy.', why:'A negative test during a bleed is often false. Every gastric ulcer is a possible cancer until histology says otherwise.'},
{t:'Withdraw', how:'Suck out the air from the stomach and re-inspect the oesophagus on the way out. Photograph the landmarks and the treated lesion.', why:'A distended stomach is uncomfortable and makes vomiting and aspiration more likely in recovery.'}
],
house:[
['How soon?','Within 24 hours of presentation, after resuscitation','High-risk patients within 12 hours (WSES 2020, 1C). Prince of Wales trial in Glasgow-Blatchford 12 or more: endoscopy within 6 hours was not better (30-day death 8.9% against 6.6%).'],
['PPI before endoscopy?','Start it, but do not let it delay the scope','Start as soon as possible (WSES 2B). Prince of Wales trial: reduced the need for endotherapy from 28% to 19%, without changing rebleeding, surgery or death.'],
['Erythromycin?','Before endoscopy in active or severe bleeding','Recommended (WSES 2B).'],
['Which method?','Two methods for active bleeding or a visible vessel','Dual-modality haemostasis (WSES 2B). Adrenaline is never enough alone (ESGE 2021).'],
['Haemostatic powder?','Refractory bleeding, as a bridge','ESGE limits it to refractory bleeding; ACG allows it for active bleeding. Hong Kong-led trial: 30-day control 90% against 81% with standard therapy.'],
['After haemostasis?','High-dose PPI for 72 hours','Recommended (WSES 2B). Prince of Wales trial: 30-day rebleeding 6.7% against 22.5% without it.'],
['Second look?','Only if it rebleeds','Not routine (ESGE 2021).']
],

anatomy:{
points:[
'Distances from the incisors: cricopharyngeus at about 15 cm, the aortic arch and left main bronchus at about 25 cm, the diaphragm and oesophagogastric junction at about 40 cm.',
'Oesophagogastric junction: the top of the gastric folds. The Z-line is the squamocolumnar junction; the diaphragmatic pinch is the hiatus. A gap between pinch and junction is a hiatus hernia.',
'Stomach: the fundus and cardia are seen properly only in retroflexion. The angulus is best seen in retroflexion or on the way out.',
'D1: the bulb, with anterior and posterior walls. At the superior duodenal angle the scope turns right and down into D2, where the ampulla sits on the medial wall.',
'Bleeding sources by site: posterior D1, gastroduodenal artery; lesser curve, left gastric branches; high lesser curve, Dieulafoy lesion; oesophagogastric junction, Mallory–Weiss tear; hiatus hernia, Cameron erosions.'
],

viva:[
['Give the Forrest classification and what you do with each.','Ia spurting and Ib oozing: treat. IIa non-bleeding visible vessel: treat. IIb adherent clot: lift it and treat beneath, or give high-dose PPI if it will not lift. IIc flat pigmented spot and III clean base: no endotherapy. Untreated rebleeding runs over 50% for class I, over 40% for IIa and over 20% for IIb.'],
['Glasgow-Blatchford or Rockall?','Glasgow-Blatchford before endoscopy, to decide who needs intervention: urea, haemoglobin, systolic pressure, pulse, melaena, syncope, liver disease and heart failure. A score of 0 or 1 can go home for outpatient endoscopy. The full Rockall needs the endoscopic findings and predicts rebleeding and death; AIMS65 predicts death.'],
['How quickly should a bleed be scoped?','Within 24 hours of presentation, once resuscitated. Lau’s Prince of Wales trial (NEJM 2020) randomised high-risk patients, Glasgow-Blatchford 12 or more, to endoscopy within 6 hours or at 6–24 hours: 30-day mortality was 8.9% against 6.6%, not significantly different. Earlier is not better if it means scoping an unresuscitated patient.'],
['Why not adrenaline alone?','It works by volume tamponade and vasoconstriction, and both wear off. Adding a second method, clips or contact thermal, reduces rebleeding, surgery and death compared with injection alone. A single method that treats the vessel itself is comparable to dual therapy.'],
['It rebleeds the next day. What now?','Repeat the endoscopy: in Lau’s 1999 trial it gave lasting control in 73%, with fewer complications than surgery. Shock at rebleeding and ulcers over 2 cm predicted failure; involve the surgeon and radiology early in those. If the second endoscopy fails: embolisation where available, otherwise surgery.'],
['The varices are bleeding. What changes?','Vasoactive drug (terlipressin, somatostatin or octreotide) for 2–5 days and ceftriaxone before endoscopy, band ligation within 12 hours, a restrictive transfusion target of 70–80 g/L, no tranexamic acid, and consideration of TIPS for high-risk or refractory bleeding (Baveno VII).'],
['A patient on aspirin for a coronary stent has a treated ulcer. Do you stop it?','Continue it, or restart within three to five days, with a PPI. Sung’s Prince of Wales trial: continuing aspirin doubled 30-day rebleeding (10.3% against 5.4%) but cut 8-week mortality from 12.9% to 1.3%. Dual antiplatelets: keep the aspirin, restart the second agent within five days.']
],

P.push({
id:'peg', team:'EGI', name:'Percutaneous endoscopic gastrostomy (PEG)', aka:'peg gastrostomy feeding tube g tube pull technique push technique introducer gastropexy enteral feeding dysphagia stroke',
system:'Endoscopy', list:'elective', approach:'Endoscopic',
aim:'Put a feeding tube into the anterior gastric wall through a tract with nothing between stomach and skin, in a patient who will live long enough to benefit.',
status:'Draft 0.1 · 23/11/2026 · sourced, not yet tested by you in the endoscopy room',
houseTitle:'Practice and evidence', houseLead:'No senior template yet: the middle column is common practice for you to correct to your unit’s.', houseHead:['Step','Common practice','Guideline'],

steps:[
{t:'Checks', how:'Indication and expected duration of tube feeding over 4 weeks; expected survival long enough to benefit. Consent or best-interest decision documented. Fasted. Antithrombotics reviewed: PEG is a high-risk procedure. INR under 1.5. Single IV dose of a beta-lactam, such as cefazolin, before the procedure. Time-out.', why:'Most deaths after PEG come from the illness, not the tube, and many are in the first week. Selection is the biggest safety step. Prophylaxis cuts peristomal infection by about two thirds.'},
{t:'Position and sedation', how:'Supine, head of the trolley raised. Sedation as planned with oxygen and continuous saturation monitoring; pharyngeal spray. Suction working. Abdomen exposed, prepped and draped.', why:'Supine lets the abdominal operator work on the anterior wall. A patient who cannot protect the airway needs an anaesthetist.'},
{t:'Diagnostic OGD', how:'Full examination to D2. Then insufflate the stomach well.', why:'Gastric outlet or duodenal obstruction is a contraindication; a lesion at the puncture site changes the site. Insufflation pushes the colon down and brings the anterior gastric wall up against the abdominal wall.'},
{t:'Transillumination', how:'Dim the room lights. Point the scope at the anterior wall of the body. The abdominal operator looks for the light through the skin, usually in the left upper quadrant below the costal margin.', why:'Light through the skin means little tissue between scope and skin. No light: suspect interposed colon or liver, or a thick abdominal wall.', tip:'Retroflex or angle up towards the anterior wall; the light is often found more medially than you expect.'},
{t:'Finger indentation', how:'Press one finger firmly on the transilluminated spot. The endoscopist must see a clean, one-to-one indentation of the gastric wall that moves with the finger.', why:'A vague or delayed bulge means something lies between. Both signs together pick the site.'},
{t:'Safe-tract test', how:'Infiltrate local anaesthetic down to the stomach with a needle on a syringe, aspirating as you advance. Air or fluid should appear in the syringe only at the moment the needle tip is seen inside the stomach.', why:'Air in the syringe before the needle is seen in the stomach means you have entered bowel lying in front of it. Withdraw and choose another site, or stop.'},
{t:'Puncture and wire', how:'1 cm skin incision along the needle track. Advance the trocar and cannula into the stomach under vision. The endoscopist opens the snare around the cannula. Pass the wire or loop through the cannula; snare it and tighten.', why:'Snaring the cannula first stops it slipping out of the stomach while the wire is passed.'},
{t:'Withdraw the scope', how:'Withdraw the scope, snare and wire together out through the mouth. The abdominal operator feeds wire in so it does not pull out of the abdomen.', why:'The wire now runs from the abdominal wall, through the stomach and oesophagus, to the mouth.'},
{t:'Pull the tube through', how:'Loop the PEG tube onto the wire and lubricate it. The abdominal operator pulls steadily on the wire until the tube emerges and the internal bumper meets resistance against the gastric wall. Stop there.', why:'Pulling past resistance drags the internal bumper into the gastric wall or out through it.', tip:'Note the centimetre mark at the skin as soon as the bumper meets the wall: that is your reference for the external bumper.'},
{t:'Check the internal bumper', how:'If your unit re-scopes: the internal bumper sits flat on the mucosa, without blanching, and there is no bleeding.', why:'A re-look catches a bumper pulled too tight or bleeding at the puncture; whether it is routine varies by unit.'},
{t:'Set the external bumper', how:'Slide the external bumper down to leave 1–2 cm of play: the tube moves in and out freely. Cut the tube to length and fit the connector. Record the centimetre mark at the skin. Dry dressing.', why:'Compression between the two bumpers causes ischaemia, infection and buried bumper. ESGE: loose external bumper, 1–2 cm from the abdominal wall.'},
{t:'Orders', how:'Feeds may start 3–4 hours after an uncomplicated PEG. Daily tube mobilisation, pushing the tube inwards, with the bumper kept loose. Restart antithrombotics as planned.', why:'Early feeding is safe (ESGE: strong recommendation, high-quality evidence). Daily mobilisation with a loose bumper helps prevent buried bumper.'}
],

house:[
['Antibiotic','Cefazolin 1 g IV before the procedure','ESGE 2021: single IV dose of a beta-lactam (strong, moderate quality). Cochrane: peristomal infection OR 0.36.'],
['Technique','Pull for most; push with gastropexy for obstructing head and neck or oesophageal cancer','ESGE 2021: pull is standard; push (introducer) where pull is contraindicated (strong, low quality).'],
['Antiplatelets','Stop clopidogrel 7 days, continue aspirin','BSG–ESGE 2021: PEG is a high-risk procedure. Continue aspirin; stop P2Y12 inhibitors 7 days before if thrombotic risk is low, otherwise discuss with the cardiologist.'],
['Re-look endoscopy','Done / not done in your unit','No guideline requirement found.'],
['External bumper','1–2 cm of play','ESGE 2021: 1–2 cm from the abdominal wall, with daily mobilisation (strong, low quality).'],
['Start of feeds','Next morning','ESGE 2021: may start within 3–4 hours (strong, high quality).']
],

anatomy:{
points:[
'Target: the anterior wall of the gastric body or the body–antrum junction, below the left costal margin and the edge of the left lobe of the liver, above the transverse colon.',
'Insufflation lifts the anterior gastric wall against the abdominal wall and pushes the transverse colon down. Under-insufflation is how colon comes to lie in front of the stomach.',
'Abdominal wall: skin, fat, anterior rectus sheath, rectus abdominis with the superior epigastric vessels behind it, posterior sheath, peritoneum. A puncture through the rectus can bleed into the sheath.',
'Gastric vessels: the gastroepiploic arcade runs along the greater curve and the left gastric along the lesser curve. Puncture away from both curves, in the middle of the anterior wall.',
'Interposition risk is higher after previous upper abdominal surgery, in kyphoscoliosis, with a high-riding colon and with hepatomegaly.',
'The three signs of a safe site together: transillumination, one-to-one finger indentation and a negative safe-tract aspiration. Lacking any one, choose another site or abandon.'
],
table:{title:'Three tests of a safe site', head:['Test','You see','Stop if'], rows:[
['Transillumination','Light through the skin, lights dimmed','No light anywhere'],
['Finger indentation','Crisp one-to-one bulge of the anterior wall','Vague, delayed or no bulge'],
['Safe-tract aspiration','Air in the syringe only as the needle is seen in the stomach','Air before the needle appears in the stomach']
]},
danger:[
'Transverse colon: puncture gives a gastrocolic or colocutaneous fistula, which may show only when the tube is changed months later.',
'Left lobe of the liver: transhepatic placement and bleeding.',
'Superior epigastric vessels: rectus sheath haematoma.',
'Gastroepiploic and left gastric vessels: bleeding into the stomach or peritoneum.',
'Oesophagus and pharynx: tumour seeding and trauma when a pull tube is dragged past an obstructing head and neck or oesophageal cancer.'
]
},

pitfalls:[
{t:'No transillumination or indentation', a:'Insufflate fully, dim the lights, try more medially and lower, and angle the scope to the anterior wall.', r:'Do not puncture blind. Abandon and arrange a radiologically inserted gastrostomy or a laparoscopic-assisted gastrostomy.'},
{t:'Air in the syringe before the needle is seen', a:'Aspirate continuously as the needle advances; watch the screen, not the needle.', r:'Bowel lies in front of the stomach. Withdraw, choose another site that passes all three tests, or abandon. If a large-bore puncture has already gone through colon, observe for peritonitis and involve your senior.'},
{t:'Bleeding at the puncture', a:'Check antithrombotics and INR beforehand; puncture the middle of the anterior wall, away from both curves.', r:'External oozing: pressure, then a stitch. Intragastric bleeding seen on re-look: endoscopic haemostasis. Rectus sheath haematoma: CT, and radiology if expanding.', u:'tightening the external bumper briefly to tamponade is described; keep it short to avoid necrosis'},
{t:'Internal bumper pulled too far', a:'Stop pulling at the first resistance and record the centimetre mark.', r:'Re-scope; if the bumper is in the wall, push the tube back in under vision and set the external bumper loose.'},
{t:'Tube comes out in the first 4 weeks', a:'Secure the tube; loose bumper but not free; teach staff not to pull on it.', r:'Do not reinsert blindly: the tract is immature and the stomach may have fallen away from the wall. Nil by tube, IV antibiotics, assess for peritonitis. Re-scope to see the hole and re-site the PEG. Peritonitis, or a hole you cannot see: laparoscopy, repair and surgical gastrostomy.'},
{t:'Peristomal infection', a:'Prophylactic antibiotic; loose external bumper; daily site care.', r:'Swab, oral antibiotics, loosen the bumper. Spreading cellulitis or crepitus: think necrotising fasciitis and debride early.'},
{t:'Buried bumper', a:'External bumper 1–2 cm from the skin; daily mobilisation pushing the tube in.', r:'Tube will not push in, leaks, or will not flush: gastroscopy. Bumper still in the stomach: endoscopic release. Bumper outside the muscularis propria: surgical removal.'},
{t:'Faeculent output or diarrhoea after a tube change', a:'Prevented at insertion: transillumination, indentation, safe-tract test.', r:'Suspect a gastrocolic fistula with the new tube in the colon. Contrast study through the tube. Remove the tube; the fistula often closes. Peritonitis: operate.'},
{t:'Free air on the film after PEG', a:'Expect it; it is not a sign of perforation on its own.', r:'Treat the patient, not the film: well, soft abdomen, feeds tolerated, observe. Pain, peritonism, fever or rising markers: CT with contrast through the tube.', u:'no figure for the frequency retrieved here'},
{t:'Tumour seeding at the stoma', a:'Push (introducer) technique with gastropexy for obstructing head and neck or oesophageal cancer.', r:'A new mass at the stoma months later: biopsy; manage with the oncology team.'}
],

viva:[
['A patient will need tube feeding for 6 weeks. Which route?','ESGE: a tube through the nose for under 4 weeks; a percutaneous tube for longer. Among percutaneous tubes, PEG is the first choice where endoscopy is possible: a meta-analysis found 30-day mortality of 5.5% after PEG against 10.5% after radiological gastrostomy.'],
['Describe the pull technique.','Diagnostic OGD and insufflation; transillumination and one-to-one finger indentation to pick the site; local anaesthetic with the safe-tract aspiration test; incision, trocar into the stomach under vision; wire through the cannula, snared and pulled out through the mouth with the scope; tube tied to the wire and pulled back down until the internal bumper meets the gastric wall; external bumper set with 1–2 cm of play.'],
['When would you use the push technique?','When the pull tube cannot pass, or should not pass, the pharynx and oesophagus: severe oesophageal stenosis, obstructing head and neck or oesophageal cancer, where a pull tube risks seeding tumour at the stoma. The stomach is fixed to the abdominal wall with gastropexy fasteners first, then a balloon tube is passed directly through the wall.'],
['Day two: the junior pulls too hard and the whole tube comes out. What now?','Do not reinsert it blindly. The tract starts to form at 1–2 weeks and is mature at about 4–6, so the stomach may have fallen away from the abdominal wall. Stop feeds, IV antibiotics, examine for peritonitis. Re-scope to see the hole and re-site the PEG. If there is peritonitis, or the hole cannot be found, laparoscopy, repair of the gastrotomy and a surgical gastrostomy.', 'scenario from your senior’s question bank'],
['What is buried bumper syndrome, and how do you prevent it?','The internal bumper migrates into the gastric wall and the mucosa grows over it. Incidence is about 1% (0.3–2.4%). The triad is a tube that will not push in, loss of patency and leakage. Prevention: external bumper 1–2 cm from the skin and daily mobilisation. Treatment depends on depth: endoscopic release if the bumper is still within the stomach; surgical removal if it lies beyond the muscularis propria.'],
['Who should not have a PEG?','Absolute: distal obstruction, uncorrectable coagulopathy, haemodynamic instability. Then the patient who will not benefit: short expected survival, advanced dementia. Most deaths after PEG come from the underlying illness, and in the NCEPOD review 43% of those who died within 30 days did so in the first week.'],
['The film the morning after shows free air. The patient is well. Do you operate?','No. Free air is common after PEG and on its own does not mean perforation. Examine: a soft abdomen, tolerated feeds and normal observations need observation only. Pain, peritonism, fever or rising markers need a CT with contrast through the tube.', 'frequency not sourced here']
],

P.push({
id:'lap-gastric-wedge', team:'EGI', name:'Laparoscopic wedge resection of gastric GIST', aka:'gist gastrointestinal stromal tumour submucosal tumour smt subepithelial wedge resection partial gastrectomy local resection leiomyoma schwannoma imatinib',
system:'Upper GI', list:'elective', approach:'Laparoscopic',
aim:'Take the tumour out whole, inside its pseudocapsule, with a rim of normal wall, without narrowing the stomach. Rupture turns a patient who would be cured into a high-risk one.',
status:'Draft 0.1 · 19/11/2026 · sourced, not yet tested by you in theatre',

steps:[
{t:'Checks and position', how:'WHO checklist. General anaesthesia. Ryle’s tube in. Split-leg (French) position, arms out, strapped for steep head-up tilt.', why:'From between the legs the surgeon looks straight up at the stomach. Head-up drops the colon and omentum out of the way.'},
{t:'Access', how:'Subumbilical incision, Hasson port by open technique. Carbon dioxide to 12 mmHg. Look at the liver and peritoneum before anything else.', why:'Open entry is house practice. Peritoneal or liver deposits change the operation into a biopsy.'},
{t:'Working ports', how:'5 mm port on the left side of the abdomen. Adhesiolysis if needed. Then a 5 mm epigastric port and a 12 mm port on the right side.', why:'Left and right ports are the two hands. The 12 mm port takes the stapler.', tip:'Before placing the 12 mm port, hold a grasper against the wall at that point and check it lines up with the staple line you plan. A stapler that comes in at the wrong angle takes too much stomach.'},
{t:'Liver retractor', how:'Insert the liver retractor and lift the left lobe towards the diaphragm.', why:'Exposes the lesser curve, the cardia and the angle of His.'},
{t:'Find the tumour', how:'Anterior wall, greater and lesser curves first. For a posterior wall tumour, open the gastrocolic ligament and enter the lesser sac.', why:'Most gastric GISTs are exophytic and seen at once. Endophytic ones are felt with an instrument or found by endoscopy.', tip:'Not visible from outside: on-table OGD. The endoscopist pushes on the lesion and the light shows you where it is.'},
{t:'Do not grasp the tumour', how:'Hold the stomach wall around it, never the tumour. Lift with stay sutures or a sling if you need traction.', why:'The pseudocapsule is thin and the tumour is friable. A tear is tumour rupture, which counts as high risk whatever the size.'},
{t:'Free the site', how:'Divide the gastroepiploic or short gastric branches at the tumour only, with the energy device close to the stomach wall.', why:'No lymphadenectomy is needed for GIST. Keeping the dissection tight to the wall spares the arcade and the spleen.'},
{t:'Wedge it out', how:'Lift the wall below the tumour and fire the linear stapler across normal stomach, about 1 cm clear of the tumour. Fire along the long axis of the stomach.', why:'A rim of normal wall gives a clear margin; wide margins add nothing. A staple line along the axis keeps the lumen open.', tip:'Near the cardia or the pylorus, ask for OGD before you fire and look at the lumen with the stapler closed.'},
{t:'Oversew', how:'House practice: oversew the staple line with continuous 3-0 V-Loc.', why:'Reinforces the line and controls bleeding points. No trial shows that it changes leak or bleeding rates.'},
{t:'Test', how:'Fill the area with saline, inflate the stomach through the Ryle’s tube, and look for bubbles and blood.', why:'A staple line leak is rare, but cheap to find now.'},
{t:'Retrieve', how:'Tumour into a retrieval bag, out through the umbilical port. Enlarge the fascia if it does not slide out easily.', why:'Pulling a tumour through a tight wound ruptures it and seeds the port site.'},
{t:'Close and send', how:'Fascia of the umbilical and 12 mm ports with 2-0 Vicryl, skin with 3-0 Ethilon. Local anaesthetic. Counts. Send the specimen intact and unopened, with the request for mitotic count and mutation analysis.', why:'Unlike an appendix or gallbladder, a GIST is not opened. The pathologist needs the capsule and margins intact to count mitoses and assess rupture.'}
],
house:[
['Approach','Laparoscopic wedge','ESMO 2022: laparoscopic resection is acceptable in favourable sites if oncological principles are kept. Avoid it for large tumours because of the rupture risk.'],
['Margin','Stapled wedge with a rim of normal wall','Aim for R0. Wide margins are not needed. After an R1 excision, re-excision is an option if the site can be found and the cost in function is small.'],
['Lymph nodes','Not taken','Lymphadenectomy is not indicated; nodal spread is rare. The exception is the SDH-deficient GIST of young patients.'],
['Staple line','Oversewn with 3-0 V-Loc','No trial evidence either way.'],
['Under 2 cm','Not usually operated','Gastric nodules under 2 cm: endoscopic ultrasound and then surveillance is standard. Excise if it grows or the patient prefers.'],
['After surgery','Oncology referral by risk','Imatinib for 3 years if the risk of recurrence is significant (SSG XVIII). Mutation analysis first: PDGFRA D842V and SDH-deficient tumours do not respond.'],
['Large or awkward tumour','Discuss at MDT','Imatinib before surgery to shrink a tumour whose resection would otherwise be extensive or mutilating.']
],

anatomy:{
points:[
'Origin: GISTs arise from the interstitial cells of Cajal in the muscularis propria. They grow outwards (exophytic), inwards under the mucosa (endophytic) or both (dumbbell). The mucosa over them may ulcerate and bleed.',
'Blood supply: left and right gastric, left and right gastroepiploic, short gastric and posterior gastric arteries. With this many inflows, a wedge almost anywhere leaves the remaining stomach well perfused.',
'Lesser sac: the posterior wall faces the pancreas, the splenic artery, the left adrenal and kidney across the lesser sac. The way in is through the gastrocolic ligament below the gastroepiploic arcade.',
'Lesser curve: carries the left gastric arcade and the anterior and posterior nerves of Latarjet. A wedge here deforms the incisura; dividing both nerves leaves the antrum unable to empty.',
'Site decides the operation: the anterior wall and greater curve take a simple wedge. The posterior wall needs the lesser sac or a transgastric approach. Near the cardia or the pylorus, a wedge narrows the lumen, so intragastric resection or a formal gastrectomy may be needed.'
],
table:{title:'Gastric GIST: risk of progression (Miettinen–Lasota)', head:['Size','≤5 mitoses per 5 mm²','>5 mitoses per 5 mm²'], rows:[
['≤2 cm','0%','Too few cases'],
['>2–5 cm','1.9%','16%'],
['>5–10 cm','3.6%','55%'],
['>10 cm','12%','86%']
]},
danger:[
'Cardia and angle of His: a staple line close to the oesophagogastric junction narrows it and causes dysphagia.',
'Pylorus: a wedge in the antrum close to the pylorus causes outlet obstruction.',
'Spleen and short gastric vessels: high greater-curve tumours lie against the gastrosplenic ligament, where the vessels are short.',
'Pancreas and splenic artery: directly behind a posterior wall tumour in the lesser sac.',
'Nerves of Latarjet: on the lesser curve. Injuring both causes delayed gastric emptying.'
]
},

pitfalls:[
{t:'Tumour ruptures', a:'Handle the stomach, not the tumour. Bag it before it leaves the abdomen. Enlarge the wound rather than squeeze it out.', r:'Retrieve the spilled tissue, wash out, and record it plainly in the note. Rupture is a high-risk feature on its own and changes the adjuvant decision. Tell the MDT.'},
{t:'Cannot find an endophytic tumour', a:'Know the site from the EUS or CT before you start. Book the endoscope.', r:'On-table OGD with transillumination. Still not found: hand-assisted or mini-laparotomy and palpate.'},
{t:'Lumen narrowed', a:'Fire along the long axis. Near the cardia or pylorus, check with the endoscope before firing.', r:'Narrowing seen on endoscopy: refashion the closure across the axis, or convert to a transgastric excision. Call.'},
{t:'Bleeding from the staple line', a:'Choose a cartridge that suits the wall thickness. Oversew.', r:'Oversew the bleeding point. Blood in the Ryle’s tube after the operation: endoscopy first.'},
{t:'Air leak on testing', a:'Test every staple line.', r:'Oversew the leaking point and test again.'},
{t:'Does not look like a GIST', a:'Review the imaging and any biopsy beforehand. A GIST is smooth and submucosal, not ulcerating with nodes.', r:'An ulcerated, indurated lesion with nodes is carcinoma until proven otherwise. A wedge is the wrong operation: take a biopsy or frozen section and call.'},
{t:'Short gastric bleeding or a splenic tear', a:'Divide the short gastrics close to the stomach with good traction.', r:'Pressure with a swab first. Then clips or energy on the vessel. A splenic capsular tear usually stops with a haemostatic agent and pressure.'}
],

viva:[
['What is a GIST, and how is it confirmed?','A mesenchymal tumour of the interstitial cells of Cajal. Half to 60% arise in the stomach. Immunohistochemistry: KIT (CD117) and DOG1 positive. Most carry a KIT mutation, usually exon 11; most of the rest PDGFRA, which is commoner in gastric tumours. A minority are KIT and PDGFRA wild type, including the SDH-deficient tumours of the young, which can spread to nodes.'],
['Should it be biopsied before resection?','Not always. A resectable lesion that looks typical can go straight to surgery. Biopsy, by endoscopic ultrasound, when it would change management: before imatinib to shrink it, when lymphoma, a neuroendocrine tumour or a metastasis is possible, or for a small lesion under surveillance. Avoid percutaneous biopsy: it risks seeding.'],
['A 1.5 cm submucosal nodule is found at OGD. What now?','Endoscopic ultrasound. Under 2 cm in the stomach, ESMO accepts surveillance with endoscopic ultrasound. Excise if it grows, if it has high-risk features on ultrasound (irregular border, cystic spaces, ulceration, echogenic foci, heterogeneity), or if the patient prefers.'],
['What makes a GIST high risk?','Size, mitotic count per 5 mm², site and rupture. Gastric tumours behave better than small-bowel ones of the same size and count. Miettinen–Lasota tabulates these; the modified NIH (Joensuu) scheme adds rupture as high risk on its own.'],
['Who gets adjuvant imatinib, and for how long?','Patients with a significant risk of recurrence, for three years. In SSG XVIII, three years against one year improved 5-year recurrence-free survival from 47.9% to 65.6% and overall survival from 81.7% to 92.0%. Mutation analysis first: PDGFRA D842V and SDH-deficient or NF1-related GISTs gain nothing.'],
['A 12 cm gastric GIST abuts the spleen and pancreas. Your plan?','Biopsy and mutation analysis, then imatinib before surgery if the mutation is sensitive, usually for six to twelve months until the response plateaus, reassessing with CT. Then resection, aiming to avoid a multivisceral or mutilating operation.'],
['Why not enucleate it?','Enucleation goes through the pseudocapsule. It risks rupture and a positive margin. A wedge of normal wall around the tumour costs little more and keeps the capsule intact.'],
['A posterior wall GIST close to the cardia: options?','A wedge from outside would narrow the cardia. Options are transgastric (intragastric) resection through an anterior gastrotomy, combined laparoscopic and endoscopic resection (LECS), or a proximal gastrectomy for larger tumours.','LECS from case series, no trials']
],

P.push({
id:'gastrojejunostomy-feeding-jejunostomy', team:'EGI', name:'Gastrojejunostomy and feeding jejunostomy', aka:'gj gjj gastroenterostomy bypass palliative gastric outlet obstruction goo unresectable gastric cancer pancreatic cancer periampullary feeding j fj witzel jejunostomy stomach partitioning devine double bypass',
system:'Upper GI', list:'both', approach:'Open, upper mini-laparotomy',
aim:'Get a patient with a blocked outlet eating again, and leave a route for feeding while they recover. It is palliation: the shortest safe operation is the right one.',
status:'Draft 0.1 · 19/11/2026 · sourced, not yet tested by you in theatre',

steps:[
{t:'Checks and induction', how:'WHO checklist. Aspirate the Ryle’s tube before induction. Rapid-sequence induction. Supine, arms out. Urinary catheter. Antibiotic prophylaxis.', why:'An obstructed stomach is full of fluid and old food. Aspiration at induction is the first avoidable death.'},
{t:'Access and assessment', how:'Upper midline mini-laparotomy. Confirm the findings: tumour, its fixity, peritoneum, liver. Biopsy if there is no tissue diagnosis.', why:'The operation is a bypass because the tumour cannot be removed. Confirm that, and get tissue for the oncologist.'},
{t:'Choose the gastric site', how:'The dependent greater curve of the body, well upstream of the tumour. Divide a few gastroepiploic branches to clear 7–8 cm, keeping the arcade.', why:'A stoma at the lowest point drains by gravity. A stoma near the tumour is soon overgrown.'},
{t:'Find the DJ flexure', how:'Lift the transverse colon. Follow the jejunum back to where it becomes fixed to the left of the spine.', why:'Measure the loop from a certain DJ flexure, or you may use ileum.', tip:'The inferior mesenteric vein runs just to the left of the flexure. If you can see it, you are in the right place.'},
{t:'Bring the loop up', how:'Take the jejunum about 30 cm from the DJ flexure, in front of the transverse colon (antecolic). Lie it along the greater curve isoperistaltic: afferent limb towards the fundus, efferent towards the antrum.', why:'Antecolic keeps the stoma away from tumour spreading into the mesocolon. A 30 cm loop reaches over the colon without tension but is not so long that it kinks.', tip:'If a bulky omentum puts the loop under tension, divide the omentum in line with the loop to let it lie flat.'},
{t:'Stapled anastomosis', how:'Stay sutures. Small gastrotomy and enterotomy side by side. Fire the 75 mm linear cutter (house: NTLC 75). Look inside the staple line for bleeding.', why:'A 75 mm side-to-side stoma is wide enough to empty and is quick to make.'},
{t:'Close the common opening', how:'Close the gastrotomy and enterotomy with 3-0 PDS (house). Check the stoma admits two fingers and the loop lies without tension or twist.', why:'The closure is the commonest leak point; take full-thickness bites and do not narrow the stoma.'},
{t:'Site the feeding jejunostomy', how:'On the efferent limb, about 20 cm beyond the gastrojejunostomy (house).', why:'Feeds go downstream of the stoma, so feeding continues even if the stomach is slow to empty.'},
{t:'Witzel tube', how:'Purse-string on the antimesenteric border. Small enterotomy. Insert a 16 Fr Foley pointing distally; inflate the balloon with 3 ml water (house). Tie the purse-string. Lay the tube along the bowel and bury it in a 4–5 cm seromuscular tunnel with interrupted sutures.', why:'The tunnel makes an oblique tract that seals when the tube comes out and resists leaks around it.', tip:'Overfill the balloon and it obstructs the jejunum. 3 ml anchors without blocking.'},
{t:'Exit and fix', how:'Bring the tube out through a separate stab on the left side of the abdomen. Stitch the jejunum to the parietal peritoneum around the exit with 3-0 PDS stays, over 3–4 cm of bowel. Anchor the tube to the skin with 2-0 silk.', why:'Fixing a length of bowel, not a point, stops the loop twisting around the tube. The seal to the peritoneum keeps any leak outside the cavity.'},
{t:'Test the tube', how:'Flush with water. It should run freely with no leak at the purse-string.', why:'A tube in the wall, not the lumen, will not flush. Find out now, not when feeding starts.'},
{t:'Close', how:'Mass closure with PDS 1, skin staples. Counts.', why:'These patients are often malnourished: take adequate fascial bites to resist dehiscence.'}

house:[

anatomy:{
points:[
'DJ flexure: the jejunum emerges to the left of L2, held by the suspensory ligament of Treitz. The inferior mesenteric vein lies just to its left in the paraduodenal fold.',
'Jejunum against ileum: jejunum is thicker and wider, with fewer arcades, longer vasa recta and clear windows in its mesentery. Ileum has more fat and several tiers of arcades.',
'Greater curve: the gastroepiploic arcade runs about 1 cm from the curve in the gastrocolic ligament. Divide branches to the wall, not the arcade.',
'Transverse colon and mesocolon: the antecolic loop lies in front of them. A retrocolic loop passes through a window in the mesocolon to the left of the middle colic vessels.',
'Loop length: too short pulls across the colon; too long kinks and causes afferent loop syndrome. Measure from the DJ flexure.'
],

['0','None'],
['1','Liquids only'],
['2','Soft solids only'],
['3','Low-residue or full diet']
]},
danger:[
'Middle colic vessels: in the mesocolon, at risk when dividing the omentum close to the colon or making a retrocolic window.',
'The tumour: an anastomosis close to it is soon overgrown.',
'The loop: a twist or a reversed loop obstructs. Check afferent and efferent before stapling.',
'The feeding tube: a tube in the bowel wall, or a balloon overfilled, obstructs the jejunum.'
]

{t:'Afferent loop syndrome', a:'Keep the afferent limb short and free of tension or kink.', r:'Acute: pain, raised amylase and a dilated duodenum on CT: a closed loop needing surgery. Chronic: bilious vomiting after meals; revise or add a side-to-side jejunojejunostomy (Braun).'},
{t:'Bleeding from the staple line', a:'Look inside before closing the common opening.', r:'Oversew from inside. After the operation: haematemesis or blood in the Ryle’s tube means OGD.'},
{t:'Leak', a:'Full-thickness closure of the common opening without tension.', r:'Contained: drain percutaneously, nil by mouth, feed through the jejunostomy. Peritonitis: relaparotomy. Call.'},
{t:'Feeding tube dislodged', a:'Witzel tunnel, peritoneal fixation, secure skin anchor.', r:'Out before the tract matures, around three weeks: do not push it back blind. Contrast study; peritonitis means relaparotomy. Later: replace through the tract and confirm with contrast.'},
{t:'Volvulus around the jejunostomy', a:'Fix 3–4 cm of bowel to the wall, not a single point.', r:'Colicky pain and vomiting with the tube in place: CT, and reoperate early.'},

],

viva:[
['Stent or bypass for malignant outlet obstruction?','SUSTENT randomised 39 patients: a stent got patients eating sooner (median 5 against 8 days), but after a bypass they spent more days eating (72 against 50) and needed fewer reinterventions. Choose by life expectancy, fitness and local skill: stent for weeks, bypass for months. EUS-guided gastroenterostomy now sits between them in expert centres (ESGE 2022).'],
['Why might the stomach not empty after a GJ?','An atonic, dilated stomach; tumour infiltrating the coeliac plexus, especially in pancreatic cancer; a stoma too small, too high or too close to the tumour; a kinked or twisted loop. Partitioning the stomach above the tumour forces food through the stoma and lowers the rate in non-randomised series.'],
['What is afferent loop syndrome?','Obstruction of the afferent limb. Acute: a closed loop with pain, raised amylase and a dilated duodenum, which can perforate. Chronic: postprandial pain relieved by vomiting bile without food. Causes: a long or kinked loop, internal hernia, adhesions, recurrence. Prevent with a short, tension-free loop; treat by revision or a Braun jejunojejunostomy.'],
['Isoperistaltic or antiperistaltic?','Isoperistaltic lays the afferent limb towards the cardia and the efferent towards the pylorus, so jejunal and gastric peristalsis run the same way. Many surgeons prefer it; the evidence that it matters is weak.','conventions vary between texts'],
['Witzel, Stamm or needle catheter?','Witzel buries the tube in a seromuscular tunnel, so the tract is oblique and seals on removal. Stamm uses concentric purse-strings without a tunnel. A needle catheter jejunostomy tunnels a fine catheter in the submucosa. Tapia’s review gives technical complications of 2.1% for a longitudinal Witzel and 1.5% for a needle catheter.'],
['Who is at risk of refeeding syndrome, and how do you prevent it?','NICE CG32. High risk: BMI under 16, weight loss over 15% in 3–6 months, little or no intake for over 10 days, or low potassium, phosphate or magnesium before feeding. Or two of: BMI under 18.5, weight loss over 10%, little intake for over 5 days, alcohol misuse or certain drugs. Start at no more than 10 kcal/kg/day, give thiamine first, and replace electrolytes daily.'],
['Pancreatic head cancer found unresectable at laparotomy, with jaundice but no vomiting. What do you do?','Biopsy, biliary bypass (hepaticojejunostomy) and a prophylactic gastrojejunostomy. In Lillemoe’s randomised trial, late outlet obstruction occurred in 19% without a GJ and none with one. Many units now stent the duct endoscopically instead and reserve surgery for those already at laparotomy.']
],

id:'lap-d2-distal-gastrectomy', team:'EGI', name:'Laparoscopic distal gastrectomy with D2 lymphadenectomy', aka:'ladg ldg lap drg radical gastrectomy subtotal gastrectomy d2 gastric cancer adenocarcinoma stomach roux-en-y billroth lymphadenectomy lymph node stations jgca',
system:'Upper GI', list:'elective', approach:'Laparoscopic-assisted',
aim:'Remove the distal two thirds of the stomach with the D2 nodes en bloc and a clear proximal margin. Then build a Roux-en-Y that will not leak, kink or reflux.',
status:'Draft 0.1 · 19/11/2026 · sourced, not yet tested by you in theatre',
houseHead:['Step','House','Guideline and trials'],

steps:[
{t:'Checks and position', how:'WHO checklist. General anaesthesia. Ryle’s tube and urinary catheter. Antibiotic prophylaxis. French position, arms out, strapped for head-up tilt.', why:'Head-up drops the colon and small bowel away from the stomach and the pancreas.'},
{t:'Access and staging', how:'Subumbilical cutdown, Hasson port. Diagnostic laparoscopy: peritoneum, liver, pelvis, ovaries. Peritoneal washings for cytology.', why:'Peritoneal deposits or positive cytology (CY1) make the disease M1. A curative resection then stops being the plan.'},
{t:'Ports', how:'5 mm epigastric port for the liver retractor. Right upper quadrant: 12 mm and 5 mm. Left upper quadrant: 5 mm and 5 mm.', why:'Five working ports let the operator swap sides between the infrapyloric and suprapancreatic phases.'},
{t:'Into the lesser sac', how:'Divide the gastrocolic ligament and enter the lesser sac. Free the anterior surface of the pancreas of its fatty lymphatic layer.', why:'Gives the view of the pancreas and its upper border, where the D2 stations lie.', tip:'Where the mesocolon is fused to the gastrocolic ligament on the right, find the thin avascular plane between them before going deeper. The middle colic vessels lie in the mesocolon.'},
{t:'Left gastroepiploic (4sb)', how:'Follow the omentum to the lower pole of the spleen. Clip and divide the left gastroepiploic vessels at their origin. Preserve the short gastric vessels.', why:'Takes station 4sb. The short gastrics are the remnant’s blood supply once the left gastric is divided.', tip:'Release omental adhesions to the splenic capsule before pulling. Traction tears the capsule.'},
{t:'Infrapyloric (4d, 6)', how:'Dissect along the head of the pancreas to the gastrocolic trunk. Clip and divide the right gastroepiploic vein above its junction with the anterior superior pancreaticoduodenal vein, and the right gastroepiploic artery at its origin from the gastroduodenal.', why:'Takes stations 4d and 6. Dividing the vein above that junction keeps the pancreatic head drainage intact and avoids the trunk of Henle.'},
{t:'Divide the duodenum', how:'Clear the first 2 cm of D1 beyond the pylorus. Transect with the endoscopic linear stapler (house: EndoGIA 45, tan reloads, two firings).', why:'Dividing early opens the view of the suprapyloric and suprapancreatic areas.', tip:'Do not skeletonise more duodenum than the stapler needs. A devascularised stump is the one that blows out.'},
{t:'Suprapyloric and hepatoduodenal (5, 12a)', how:'Clip the right gastric artery flush at its origin. Clear the lymphatics along the proper hepatic artery, medial to the common bile duct.', why:'Takes stations 5 and 12a. The portal vein lies behind and the bile duct lateral.'},
{t:'Suprapancreatic (7, 8a, 9, 11p)', how:'Clear the nodes along the common hepatic artery, around the coeliac trifurcation and along the proximal splenic artery. Clip the left gastric vein and then the left gastric artery flush at their origins.', why:'The core of a D2. The left gastric vein usually crosses in front of or behind the common hepatic artery; find it before it bleeds.', tip:'Lift the left gastric pedicle up and towards the abdominal wall. The plane on the pancreas then opens without heat on the gland.'},
{t:'Lesser curve and cardia (1, 3)', how:'Clear the lesser curve and the right paracardial nodes up to the planned line of transection.', why:'Takes stations 1 and 3, so the specimen leaves with the whole D2 field attached.'},
{t:'Mini-laparotomy', how:'Upper midline mini-laparotomy. Wound protector. Deliver the stomach.', why:'Transection and reconstruction are done extracorporeally in the house laparoscopy-assisted technique.'},
{t:'Proximal transection', how:'Transect with the linear stapler (house: NTLC 75), leaving about one third of the stomach. Check the margin on the specimen before reconstructing.', why:'JGCA: at least 3 cm for an expansive and 5 cm for an infiltrative T2 or deeper tumour, 2 cm for T1. Frozen section if close.', tip:'For an early tumour you cannot feel, have it clipped or tattooed before the operation, or check with on-table OGD.'},
{t:'Reinforce the staple lines', how:'Bury the duodenal stump and the gastric remnant staple lines with 3/0 PDS.', why:'House practice to protect the stump. The stump leak is the most dangerous leak after this operation.'},
{t:'Roux limb', how:'Divide the jejunum with the linear stapler and bury the stump. Bring the distal limb up antecolic. Side-to-side jejunojejunostomy with continuous 3/0 PDS, 40 cm or more down the Roux limb.', why:'A Roux limb of this length keeps bile out of the remnant.', tip:'Mark the proximal end of the Roux limb with a stitch before dividing. Joining the biliopancreatic limb to the stomach by mistake (a Roux-en-O) is a disaster.'},
{t:'Gastrojejunostomy', how:'Stapled side-to-side gastrojejunostomy (house: NTLC 75). Close the common opening with 3/0 PDS.', why:'A wide stapled stoma empties well and is quick to make through a small wound.'},
{t:'Close the windows', how:'Close the jejunojejunostomy mesenteric defect and Petersen’s space.', why:'Open defects allow internal herniation and closed-loop obstruction later.'},
{t:'Check and close', how:'OGD to check the anastomosis for patency and bleeding. NG tube placed in the jejunum. Tube drain beneath the anastomosis, passing through Morison’s pouch to lie by the duodenal stump. Fascia PDS 1, port fascia 2/0 Vicryl, skin staples. Counts.', why:'An early stump or pancreatic leak declares itself in the drain.', tip:'Ask whether your unit sends the nodes separately by station. At least 16 nodes are needed for accurate staging.'}
],
house:[
['Approach','Laparoscopy-assisted, extracorporeal anastomoses','Stage I: KLASS-01 and JCOG0912 showed laparoscopy non-inferior. Locally advanced: KLASS-02 and CLASS-01 showed the same, with qualified surgeons.'],
['Extent of nodes','D2','JGCA 2021: D2 for cN+ or cT2–T4. D1 or D1+ for cT1N0.'],
['Omentum','Per consultant','JGCA: omentectomy is usual for T3 or deeper. For T1 and T2, omentum beyond 3 cm from the gastroepiploic arcade may be kept.'],
['Margin','About one third of the stomach left','At least 3 cm (expansive) or 5 cm (infiltrative) for T2 or deeper; 2 cm for T1. Frozen section when close.'],
['Reconstruction','Antecolic Roux-en-Y','Billroth I, Billroth II and Roux-en-Y are all accepted. Roux-en-Y causes less bile reflux and remnant gastritis but risks Roux stasis.'],
['Mesenteric defects','Closed','Closure prevents internal hernia. The best trial evidence is from gastric bypass for obesity.'],
['Drain','Tube drain by the stump','Cochrane review: no evidence that a routine drain improves outcome after gastrectomy.'],
['Chemotherapy','MDT decision','Perioperative FLOT (FLOT4), or adjuvant S-1 (ACTS-GC) or CAPOX (CLASSIC) for stage II–III.']
],

anatomy:{
points:[
'What is divided: the left gastric artery from the coeliac (station 7), the right gastric from the hepatic (5), the right gastroepiploic from the gastroduodenal (6) and the left gastroepiploic from the splenic (4sb), all at their origins. The remnant then lives on the short gastric and posterior gastric arteries.',
'Infrapyloric veins: the right gastroepiploic vein joins the anterior superior pancreaticoduodenal vein and often the right colic vein to form the gastrocolic trunk of Henle. Divide the gastroepiploic vein above that junction.',
'Upper border of the pancreas: the common hepatic artery runs along it. Station 8a lies in front of and above it; 8p, behind it, is not part of a D2. The left gastric vein drains into the portal or splenic vein, passing in front of or behind the common hepatic artery.',
'Hepatoduodenal ligament: 12a lies along the proper hepatic artery. The bile duct is lateral and the portal vein behind.',
'Aberrant left hepatic artery: arises from the left gastric artery and runs in the lesser omentum. Divide the left gastric at its origin and a replaced artery takes the left lobe’s arterial supply with it.'
],

pitfalls:[
{t:'Duodenal stump leak', a:'Transect healthy duodenum, keep its blood supply, bury the staple line, keep the remnant decompressed.', r:'Contained, with a drain in place: nil by mouth, nutrition through the jejunum, drain kept. Peritonitis or uncontrolled: relaparotomy with a tube duodenostomy as a controlled fistula and wide drainage. Call.'},
{t:'Pancreatic fistula', a:'Keep the energy device off the gland. Dissect in the plane on the pancreas, not in it.', r:'Drain amylase over three times the serum upper limit from day 3 is a fistula. Keep the drain; image for collections; drain them percutaneously.'},
{t:'Bleeding at the gastrocolic trunk or left gastric vein', a:'Identify the trunk and the vein before dividing anything near them.', r:'Pressure with a small swab through a port, then a second instrument to clip. Not controlled in two minutes: convert. Call.'},
{t:'Proximal margin close or involved', a:'Know the tumour type and margin target before the stapler goes on.', r:'Frozen section. Involved: a further ring of stomach, or completion to total gastrectomy with a Roux-en-Y oesophagojejunostomy. Call.'},
{t:'Wrong limb to the stomach (Roux-en-O)', a:'Stitch-mark the proximal end of the Roux limb. Trace both limbs before stapling.', r:'Recognised on the table: take it down and redo it. Recognised later as bilious vomiting and obstruction: reoperation.'},
{t:'Peritoneal disease found', a:'Stage with laparoscopy and washings first, before any dissection.', r:'Biopsy, stop the resection, close. An obstructing or bleeding tumour may still need palliative resection or bypass. MDT.'},
{t:'Splenic capsule tear', a:'Release omental adhesions before traction.', r:'Pressure and a haemostatic agent. Splenectomy only for uncontrolled bleeding. Call.'},
{t:'Aberrant left hepatic artery', a:'Look in the lesser omentum before dividing it; check the CT.', r:'A small accessory artery may be divided. A replaced artery supplying the left lobe should be preserved, taking the left gastric distal to its origin. Call.'}
],
