viva:[
['Define D1, D1+ and D2 for a distal gastrectomy.','JGCA 2021. D1: stations 1, 3, 4sb, 4d, 5, 6 and 7. D1+: D1 with 8a and 9. D2: D1 with 8a, 9, 11p and 12a. Station 14v is no longer part of a D2.'],
['What is the evidence for D2?','The Dutch D1D2 trial: no difference in overall survival at 15 years, but gastric cancer death fell from 48% to 37%, at the cost of postoperative mortality of 10% against 4%, driven by splenectomy and pancreatectomy. The MRC trial found the same excess morbidity. JCOG9501 found that going beyond D2 to para-aortic nodes adds nothing. A pancreas- and spleen-preserving D2 in a high-volume unit is now standard.'],
['Is laparoscopic gastrectomy oncologically safe?','For stage I, KLASS-01 and JCOG0912 showed non-inferior survival. For locally advanced disease, KLASS-02 (5-year overall survival 88.9% against 88.7%) and CLASS-01 (3-year disease-free survival) showed non-inferiority, in qualified surgeons’ hands, with fewer complications in KLASS-02.'],
['What margin do you need, and how do you check it?','JGCA: 2 cm for T1; for T2 or deeper, 3 cm for an expansive and 5 cm for an infiltrative tumour. Where the margin is close, frozen section. For an impalpable early tumour, preoperative clips or tattoo, or on-table endoscopy.'],
['Billroth I, Billroth II or Roux-en-Y?','Billroth I is physiological with one anastomosis but needs a large remnant and causes bile reflux. Billroth II reaches easily but brings bile reflux and the risk of afferent loop syndrome. Roux-en-Y prevents reflux and remnant gastritis but adds an anastomosis and the risk of Roux stasis and internal hernia. JGCA accepts all three.'],
['Day 5: tachycardia, pain, bile in the drain.','Duodenal stump leak until proven otherwise. Resuscitate and CT with oral contrast. Controlled through the drain in a stable patient: nil by mouth, jejunal feeding, antibiotics, drain kept, collections drained percutaneously. Peritonitis or sepsis: relaparotomy, washout, tube duodenostomy through the defect as a controlled fistula, wide drainage, feeding jejunostomy.','management from case series and expert opinion'],
['What does positive peritoneal cytology mean?','CY1 is M1, stage IV, even without visible deposits. Staging laparoscopy with washings is recommended before treatment for advanced (cT3–T4) tumours, because it changes the plan in a meaningful minority.'],
['What chemotherapy accompanies the operation?','Perioperative FLOT in FLOT4 improved median overall survival to 50 months from 35 with ECF or ECX. In Asia, adjuvant S-1 (ACTS-GC: 5-year overall survival 71.7% against 61.1% with surgery alone) or capecitabine with oxaliplatin (CLASSIC: 5-year disease-free survival 68% against 53%) for stage II–III after D2.']
],

what:'Removal of the whole stomach, or of the remnant after an earlier gastrectomy, with the D2 nodes, reconstructed with a Roux-en-Y oesophagojejunostomy.',
when:[
'Cancer of the upper or middle third where a distal gastrectomy cannot give a clear proximal margin: JGCA asks for 3 cm for an expansive and 5 cm for an infiltrative T2 or deeper tumour.',

outline:[
'Laparotomy; for a completion, excise the old scar and divide adhesions, which are often dense at the porta hepatis.',
'Survey the peritoneum and liver; peritoneal washings.',
'Divide the short gastric vessels; keep the spleen.',
'Mobilise the abdominal oesophagus; take stations 1 and 2.',
'Completion only: transect the afferent and efferent limbs of the old gastrojejunostomy with a linear stapler and bury the staple lines.',
'Clear the coeliac, common hepatic and splenic artery nodes. D2 for a total gastrectomy: stations 1–7, 8a, 9, 11p, 11d and 12a.',
'Transect the abdominal oesophagus; insert the anvil of the circular stapler and secure it with a 2-0 Prolene purse-string.',
'Antecolic Roux-en-Y: side-to-side jejunojejunostomy with continuous 3-0 PDS; end-to-side oesophagojejunostomy with the circular stapler (house: powered CDH 29); close the jejunal opening with 3-0 PDS.',
'Check the anastomosis; tube drains behind the oesophagojejunostomy through Morison’s pouch; mass closure with PDS 1.'
],
points:[
'Margin: send the oesophageal ring and margin for frozen section when the tumour approaches the junction.',
'Spleen: keep it. In JCOG0110, splenectomy for proximal cancer not invading the greater curve added complications without improving survival.',
'Bursectomy: no survival benefit in JCOG1001, so the lesser sac lining is not stripped.',
'The oesophagojejunostomy leak is the dangerous complication: it sits high, near the hiatus and the left pleura.',
'For life: vitamin B12 replacement (no intrinsic factor), iron, calcium and vitamin D; small frequent meals; watch for dumping and weight loss.',
'Completion gastrectomy: the old anastomosis, its afferent limb and porta adhesions are where the duct and hepatic artery are at risk.'
],
viva:[
['Why not take the spleen routinely?','JCOG0110 randomised patients with proximal gastric cancer not invading the greater curve: splenectomy did not improve survival and caused more complications, mainly pancreatic fistula. Splenectomy is now kept for tumours invading the greater curve or the spleen itself.'],
['Total or subtotal for a distal cancer?','Subtotal, if the margin allows. The Italian multicentre trial (Bozzetti 1999) found similar 5-year survival for distal cancers, and a subtotal gastrectomy leaves better nutrition and quality of life.'],
['Why does the patient need vitamin B12?','Parietal cells make intrinsic factor, without which B12 is not absorbed in the terminal ileum. Liver stores last years, so deficiency appears late. Replace B12 for life by injection, and check iron and folate.'],
['A 30-year-old carries a pathogenic CDH1 variant. What do you offer?','Referral to a specialist team. The 2020 International Gastric Cancer Linkage Consortium guidance recommends prophylactic total gastrectomy, usually between 20 and 30 years of age, with annual endoscopic surveillance for those who decline. Women also need breast surveillance for lobular cancer.','risk figures vary between cohorts'],
['How do you reconstruct after a total gastrectomy?','Roux-en-Y oesophagojejunostomy is standard: a Roux limb of about 40 cm or more prevents bile reflux into the oesophagus. A jejunal pouch may improve eating in the first year; jejunal interposition is rarely used.','pouch evidence from small trials']
],

aim:'Find the transition point, release what is causing the obstruction, decide which bowel will live, and get out without making holes. Divide only the adhesions you need to.',

steps:[
{t:'Checks and induction', how:'WHO checklist. Aspirate the Ryle’s tube, then rapid-sequence induction. Supine, arms out. Urinary catheter. Antibiotic prophylaxis.', why:'Obstructed patients aspirate at induction. The catheter measures the resuscitation.'},
{t:'Incision', how:'Midline laparotomy. Start through virgin abdomen above or below the old scar, then extend under vision.', why:'Bowel is stuck to the underside of old scars. Entering beside them lets you see and free it from inside.'},
{t:'Enter safely', how:'Open the peritoneum under vision. Free bowel from the abdominal wall with scissors and traction, close to the peritoneum, not the bowel.', why:'Most inadvertent enterotomies happen on entry.', tip:'Lift the fascial edge with Kochers and slide a finger in from the virgin area to feel the plane before you cut.'},
{t:'Find the transition point', how:'Start at the caecum and follow the collapsed ileum backwards until it meets dilated bowel.', why:'Collapsed bowel is easy to handle and leads straight to the cause. Distended loops tear.', tip:'Do not eviscerate the dilated loops early. Work from the collapsed side and bring the transition point to you.'},
{t:'Release the cause', how:'Divide the band or adhesion causing the obstruction. Free kinks at the transition point. Leave other adhesions unless they obstruct.', why:'Every extra adhesion divided adds a chance of an enterotomy and adds nothing to this operation.'},
{t:'Look for other causes', how:'Groins and obturator canals from inside, internal hernia defects, a gallstone, a tumour, a Meckel’s band.', why:'Not every obstruction in a scarred abdomen is adhesive. The cause changes the operation.'},
{t:'Judge viability', how:'Wrap the released loop in warm packs and wait 10–15 minutes. Then check colour, sheen, peristalsis and mesenteric pulsation. Inspect the constriction ring where the band lay.', why:'Dusky bowel often recovers once released. A ring that stays thin and grey perforates later.', tip:'A doubtful constriction ring can be buried with interrupted seromuscular Lembert sutures. A ring that is clearly dead is resected.'},
{t:'Resect what is dead', how:'Resect with a margin of healthy bowel. Stapled or hand-sewn anastomosis if the patient is stable; staple the ends and plan a relook if not.', why:'An anastomosis in a shocked, acidotic patient leaks. Discontinuity and a relook in 24–48 hours is safer.'},
{t:'Run the whole bowel', how:'DJ flexure to ileocaecal valve. Repair full-thickness enterotomies across the bowel with 3-0 sutures; bury serosal tears.', why:'A missed enterotomy is the commonest cause of a leak after adhesiolysis.'},
{t:'Decompress if needed', how:'Gently milk the small bowel contents back to the stomach for the anaesthetist to aspirate through the Ryle’s tube.', why:'Makes the abdomen closable and shortens the ileus. Rough milking tears serosa.'},
{t:'Close', how:'Wash out if there was spillage. Mass closure (house: PDS loop). Skin staples. Counts.', why:'A tense closure over distended bowel raises intra-abdominal pressure and bursts.'}

'Blood supply: jejunal and ileal branches of the superior mesenteric artery form arcades; the vasa recta beyond them are end arteries. A band across the mesentery strangulates the loop it crosses.',
'Common adhesion sites: the underside of the old scar, the pelvis after hysterectomy or rectal surgery, and the right iliac fossa after appendicectomy.',
'Internal hernia sites: Petersen’s space and mesenteric defects after Roux-en-Y, the paraduodenal fossae, and defects after previous resections.',
'Other causes found at laparotomy: groin or obturator hernia, gallstone ileus at the terminal ileum, small bowel tumour, bezoar, Meckel’s band, intussusception.'

viva:[
['Who can you treat without an operation?','Patients without peritonitis, strangulation or a closed loop on CT. Bologna 2017: decompress, correct fluids and give water-soluble contrast. Contrast in the colon within 24 hours predicts resolution. Without resolution by 72 hours, operate.'],
['What on CT tells you to operate now?','Reduced wall enhancement, mesenteric oedema or fluid, a closed loop (two adjacent transition points, a U- or C-shaped loop), the whirl sign, pneumatosis or portal venous gas, free fluid with peritonitis.'],
['How does gastrografin work?','It is hyperosmolar: it draws fluid into the lumen, reduces wall oedema and may increase motility. Its main value is prognostic. Contrast in the colon on a film at 4–24 hours predicts resolution; contrast that has not reached the colon predicts the need for surgery.'],
['Is laparoscopic adhesiolysis better?','In LASSO, patients likely to have a single band recovered faster with laparoscopy (stay 4.2 against 5.5 days), with similar long-term outcomes. It is for selected patients: a first episode, few previous operations, not grossly distended, and a surgeon who will convert early.'],
['How do you judge viability?','Release, warm and wait 10–15 minutes. Then colour, sheen, peristalsis, mesenteric pulsation and bleeding from the cut edge. Fluorescence angiography helps where available. When unsure in a sick patient, or when resection would leave too little bowel, close temporarily and relook in 24–48 hours.'],
['What is short bowel syndrome, and when do you worry?','Malabsorption from too little functional small bowel. Under about 200 cm risks it; under 100 cm with an end jejunostomy, or under 50–60 cm with the colon in continuity, usually needs parenteral support. Measure what remains and write it in the note.','thresholds vary with the colon and ileocaecal valve']
],

id:'hartmanns-procedure', team:'CRS', name:'Hartmann’s procedure', aka:'hartmann hartmanns sigmoid colectomy end colostomy perforated diverticulitis hinchey faecal peritonitis purulent obstructing left colon cancer large bowel obstruction rectal stump',
system:'Colorectal and small bowel', list:'emergency', approach:'Open, after diagnostic laparoscopy',
aim:'Remove the diseased left colon, close the rectum and bring out an end colostomy. It controls sepsis or obstruction without an anastomosis in a patient who could not survive a leak.',

steps:[
{t:'Checks and position', how:'WHO checklist. Rapid-sequence induction. Modified Lloyd-Davies position. Urinary catheter. Antibiotics running. Stoma site marked on the left beforehand if time allows.', why:'Lloyd-Davies gives access to the anus for a rectal washout. A marked site through rectus, away from creases, makes a stoma the patient can manage.'},
{t:'Diagnostic laparoscopy', how:'Subumbilical incision, linea alba split, open entry. Confirm the diagnosis and grade it.', why:'Confirms the source and the Hinchey grade before committing to a laparotomy. House practice is to convert once confirmed.'},
{t:'Laparotomy and decontamination', how:'Midline laparotomy. Findings recorded. Initial decontamination with warm saline.', why:'Removing gross contamination first makes the dissection cleaner and the field visible.'},
{t:'Mobilise the left colon', how:'Lateral approach: incise along the white line of Toldt and lift the colon off Gerota’s fascia. Identify the left ureter and protect it.', why:'The ureter crosses the iliac bifurcation under the sigmoid mesocolon. Seen early, it is safe; assumed, it is cut.', tip:'If the inflamed mesocolon hides the ureter, find it higher on the psoas, above the inflammation, and follow it down.'},
{t:'Divide the mesocolon', how:'House: control the mesocolon between silk ligatures and divide it. For cancer, ligate the inferior mesenteric or the sigmoid and left colic vessels at their origin.', why:'Close to the bowel is enough for diverticular disease. An emergency cancer operation should still be an oncological one where the patient allows.'},
{t:'Down to the upper rectum', how:'Dissect the mesorectum down to the sacral promontory. Find where the taeniae splay out: that is the rectum.', why:'Leaving sigmoid colon in the stump risks recurrent diverticulitis and a harder reversal.', tip:'Keep in the plane in front of the hypogastric nerves at the promontory; they lie on the presacral fascia.'},
{t:'Rectal washout', how:'House: wash out the rectum with Betadine through the anus before dividing it.', why:'Clears faeces and, in cancer, exfoliated cells from the stump.'},
{t:'Divide', how:'Proximal transection at the distal descending colon with a linear cutter (house: TLC 55). Distal transection at the upper rectum with a linear stapler (house: TA 30). Reinforce the rectal stump with continuous 3-0 PDS.', why:'A reinforced stump is less likely to leak into the pelvis.', tip:'A long non-absorbable stitch on each corner of the stump makes it easier to find at reversal.'},
{t:'Wash out and drain', how:'Haemostasis. Irrigate with warm saline until clear (house: 10 L total); suck dry. Two tube drains: left lower quadrant to the left paracolic gutter, right lower quadrant to the pouch of Douglas, anchored with 2-0 Nylon.', why:'The pelvis and gutters collect residual pus.'},
{t:'Bring out the colon', how:'Trephine through rectus on the left at the marked site. Bring the descending colon through without tension and without twisting.', why:'Tension causes retraction; a tight trephine causes ischaemia. Check the colour of the end before closing.'},
{t:'Close and mature', how:'Mass closure (house: PDS loop). Skin staples and dressing. Then open and mature the end colostomy with 3-0 Vicryl and apply the bag.', why:'Maturing the stoma after the wound is sealed keeps the colostomy contents off the incision.'}
],

'White line of Toldt: the peritoneal reflection along the lateral colon. Behind it, Toldt’s fascia separates the mesocolon from Gerota’s fascia; stay on the colon side.',

'Rectosigmoid junction: the taeniae coli spread into a continuous longitudinal muscle coat, at about the level of the sacral promontory.',
'Marginal artery: supplies the proximal end once the mesentery is divided. Pulsatile bleeding from the cut edge before it goes through the trephine is reassuring.',
'Stoma site: through the rectus, in the left iliac fossa below the umbilicus, away from scars, creases and the belt line.'

viva:[
['Hinchey IV in a stable 60-year-old: Hartmann’s or primary anastomosis?','In a stable, immunocompetent patient, primary anastomosis with a defunctioning ileostomy. LADIES found better stoma-free survival at 12 months (94.6% against 71.7%) without more short-term harm, and reversing an ileostomy is a smaller operation. Hartmann’s if unstable, immunosuppressed, or the bowel or patient is poor.'],
['What about laparoscopic lavage?','For purulent (Hinchey III) peritonitis without a visible perforation, lavage avoids a stoma in many patients. The trials (LOLA, DILALA, SCANDIV) found more reinterventions and missed cancers, so it is for selected patients in experienced hands, not routine.'],
['An obstructing sigmoid cancer in a fit patient: options?','Resection with primary anastomosis, with or without a defunctioning stoma; Hartmann’s if high risk; a stent as a bridge to elective resection; or a defunctioning colostomy then neoadjuvant treatment or elective resection. Check the caecum: a closed loop with a competent ileocaecal valve threatens caecal perforation.'],
['Why mature the stoma after closing the wound?','The colostomy opens on to a contaminated field. Sealing the wound first keeps faeces off it and lowers wound infection.'],
['When and how do you reverse a Hartmann’s?','At 3–6 months, when the patient has recovered and the colon has been checked by colonoscopy or CT colonography. Contrast enema of the stump. Laparoscopic or open; mobilise the splenic flexure if needed; circular stapled colorectal anastomosis; consider a defunctioning ileostomy. Complications in 22.9–68.4% and death in 0–4.7% across series.'],
['What causes stomal necrosis, and what do you do?','Excess tension, a tight trephine, a mesentery stripped too far, or a twisted colon. Check depth with a test tube and a light inside the stoma: mucosal necrosis above the fascia can be watched; necrosis below the fascia needs re-fashioning.']
],

aim:'Relieve the constriction, look at the bowel before it slips back, resect what is dead, and repair the defect, with mesh unless the field is contaminated.',

steps:[
{t:'Checks and induction', how:'WHO checklist. Mark the side. Rapid-sequence induction if obstructed, after aspirating the Ryle’s tube. Antibiotic prophylaxis. Consent includes laparotomy and bowel resection.', why:'An obstructed patient aspirates. The incision may need to grow.'},
{t:'Choose the incision', how:'Inguinal hernia: standard groin incision. Femoral hernia: low (Lockwood) if the bowel looks safe; high preperitoneal (McEvedy) or trans-inguinal (Lotheissen) if a resection is likely.', why:'The low approach gives poor access to bowel. The high approach lets you resect through the same wound.'},
{t:'Open the sac before reducing', how:'Dissect the sac, open it at its fundus, and hold the contents with Babcock forceps before releasing anything.', why:'Once the constriction is released the contents slip back, and dead bowel returned unseen perforates in the abdomen.', tip:'Send some sac fluid for culture. Clear fluid is reassuring; blood-stained or foul fluid means strangulation.'},
{t:'Release the constriction', how:'Inguinal: divide the deep ring or neck upwards and laterally. Femoral: divide the lacunar ligament medially.', why:'The inferior epigastric vessels lie medial to the deep ring; the femoral vein lies lateral to the femoral canal. Cut away from both.', tip:'Before dividing the lacunar ligament, feel for an abnormal obturator artery crossing it (the corona mortis).'},
{t:'Judge viability', how:'Draw out a little more bowel to see both constriction rings. Warm packs for 10 minutes. Colour, sheen, peristalsis, mesenteric pulsation.', why:'The constriction rings are where the bowel is most damaged and most often missed.'},
{t:'Resect if dead', how:'Resect with a margin of healthy bowel and anastomose. Do it through the hernia wound if you can deliver enough bowel; otherwise extend preperitoneally or make a separate laparotomy.', why:'Pulling bowel through a small neck tears the mesentery.'},
{t:'If it reduced before you saw it', how:'Hernioscopy: pass a laparoscope through the sac into the abdomen. Or a diagnostic laparoscopy.', why:'WSES 2017 (2B): laparoscopy checks viability after spontaneous reduction, sparing a laparotomy.'},
{t:'Deal with the sac', how:'Reduce the contents. Indirect sac: transfix and excise at the deep ring. Femoral sac: reduce or excise from below or above.', why:'Leaves no peritoneal pocket to recur into.'},
{t:'Repair', how:'No resection, or resection without gross spillage: Lichtenstein mesh for inguinal; mesh plug or preperitoneal mesh for femoral. Gross contamination: tissue repair.', why:'WSES 2017 (1A): synthetic mesh is safe in clean and clean-contaminated fields and lowers recurrence.'},
{t:'Close', how:'Close in layers. Local anaesthetic to the wound. Counts.', why:'Infiltration reduces opioid need after an emergency groin repair.'}
],

anatomy:{
points:[
'Deep ring: lies lateral to the inferior epigastric vessels. Indirect hernias emerge here; release a tight ring upwards and laterally.',
'Femoral canal: in front, the inguinal ligament; behind, the pectineal (Cooper’s) ligament; medially, the lacunar ligament; laterally, the femoral vein. Its rigid neck is why femoral hernias strangulate.',
'Telling them apart: a femoral hernia emerges below and lateral to the pubic tubercle; an inguinal hernia above and medial to it.',
'Corona mortis: an abnormal obturator artery or vein from the inferior epigastric or external iliac crossing the lacunar ligament. Cut blindly, it bleeds into the pelvis.',
'Richter’s hernia: only the antimesenteric wall is trapped, so it can strangulate without obstruction.',
'Reduction en masse: sac and contents pushed back together, still strangulated. Maydl’s hernia: a W loop whose middle, strangulated segment lies inside the abdomen.'
],

['Trans-inguinal (Lotheissen)','Inguinal incision, through the posterior wall','Unsure whether inguinal or femoral; weakens the inguinal floor'],
['High (McEvedy, preperitoneal)','Above the inguinal ligament at the lateral rectus edge','Strangulation; bowel can be resected through the same wound']
]},
danger:[
'Inferior epigastric vessels: medial to the deep ring.',
'Femoral vein: lateral to the femoral canal; a bite too far laterally narrows or punctures it.',
'Corona mortis: on the lacunar ligament.',
'Bladder: medial, in a sliding direct or femoral hernia.',
'Ilioinguinal and genital branch of the genitofemoral nerves: in the inguinal canal.',
'Dead bowel returned to the abdomen unseen.'
]
},

viva:[
['How do you tell a femoral from an inguinal hernia on the table?','A femoral hernia emerges below the inguinal ligament, below and lateral to the pubic tubercle, and passes medial to the femoral vein. An inguinal hernia lies above the ligament, above and medial to the tubercle. From inside, the femoral ring sits below the iliopubic tract, medial to the vein.'],
['Which femoral approach for a strangulated hernia, and why?','High (McEvedy) or preperitoneal: it shows the neck from above, lets you divide the lacunar ligament under vision, and lets you resect bowel through the same wound. The low approach is quick and good for elective or viable cases but cramped for resection.'],
['Can you use mesh after a bowel resection?','WSES 2017: yes, a synthetic mesh can be used after strangulation or resection without gross spillage (1A), with lower recurrence and no more 30-day wound complications. With gross contamination, repair primarily if the defect is small, or use a biological mesh.'],
['What is the corona mortis?','An abnormal obturator artery or vein, usually from the inferior epigastric or external iliac, crossing the superior pubic ramus behind the lacunar ligament. Cut while freeing a femoral hernia, it retracts and bleeds into the pelvis.','prevalence varies widely between cadaveric series'],
['The hernia reduced in the emergency department. Now what?','If strangulation was likely (tenderness, skin change, raised lactate), admit and examine the bowel: diagnostic laparoscopy (WSES 2B). Beware reduction en masse. If the hernia was simply incarcerated and the patient is well, repair it urgently on the same admission.'],
['Why are femoral hernias more dangerous?','The neck is narrow and rigid: inguinal ligament, lacunar ligament, pectineal ligament and femoral vein. In the Swedish register, 35.9% of femoral repairs were emergencies against 4.9% of inguinal, and 22.7% of emergency femoral repairs needed a bowel resection. Repair every femoral hernia soon after diagnosis.']
],

anatomy:{
points:[
'Origin: most abscesses start in an anal gland opening at a crypt on the dentate line; the gland lies in the intersphincteric space. Pus spreads down, out or up from there.',
'Spaces: perianal (subcutaneous, at the verge), ischiorectal (lateral to the external sphincter, below levator), intersphincteric (between the sphincters), supralevator (above levator ani).',
'Horseshoe: pus crosses posteriorly through the deep postanal space between the ischiorectal fossae.',
'Sphincters: the internal sphincter is the thickened circular smooth muscle of the rectum; the external sphincter is striated and continuous with puborectalis above. The anorectal ring is palpable on rectal examination.',
'Goodsall’s rule: with a line across the anus from 3 to 9 o’clock, an external opening in front usually tracks radially to the nearest crypt; one behind usually curves to the posterior midline. Openings more than 3 cm from the verge break the rule.'
],

['Extrasphincteric','From rectum above levator, outside the sphincters','Specialist surgery; often from a wrongly drained abscess or Crohn’s']

'Necrotising infection: crepitus, dusky skin or pain beyond the signs. It is a different operation.'

viva:[
['Classify anorectal abscesses.','By the space: perianal, ischiorectal, intersphincteric and supralevator, with horseshoe extension through the deep postanal space. Most start in an anal gland in the intersphincteric plane.'],
['Do you lay open a fistula at the first operation?','Only a clearly low, simple fistula in a patient with normal continuity, ideally by an experienced surgeon. ASCRS 2022 (2B) allows it; a Cochrane review found lower recurrence. If the track is high, unclear or anterior in a woman, place a loose seton or leave it.'],
['Should the cavity be packed?','PPAC2 randomised 433 patients: no packing was less painful, with recurrence 6% against 3%, not significantly different, and no significant rise in fistula. Many units have stopped routine packing.'],
['When are antibiotics indicated?','ASCRS 2022 (2B): cellulitis, systemic signs of infection, or immunosuppression. Not as a substitute for drainage.'],
['State Goodsall’s rule and its limits.','With a line from 3 to 9 o’clock, an anterior external opening tracks radially to the nearest crypt; a posterior one curves to the posterior midline. It is less reliable for anterior openings more than 3 cm from the verge, in women, and in Crohn’s.'],
['How do you drain a supralevator abscess?','By its origin. From an intersphincteric abscess: into the rectum. From an ischiorectal abscess: through the perineum. Draining it the other way creates an extrasphincteric fistula. If the origin is a pelvic source (diverticular, Crohn’s, appendiceal), treat that.']
],

houseTitle:'Practice and evidence', houseLead:'There is no senior template for this. The middle column is from Deon’s trauma notes and common practice: correct it to your trauma centre’s protocol.', houseHead:['Step','Practice','Guideline and trials'],

steps:[
{t:'Prepare the room', how:'Massive transfusion protocol running. Tranexamic acid given within 3 hours of injury. Warm theatre, warm fluids, blood warmer and rapid infuser. Two large suckers, cell saver, vascular clamps, plenty of large packs. Antibiotics.', why:'Most of the battle is resuscitation. The operation buys time for it.'},
{t:'Prep before induction', how:'Patient supine, arms out. Prep and drape from the chin to mid-thigh, surgeon scrubbed and ready, before rapid-sequence induction.', why:'Muscle relaxation releases the tamponade of a tense abdomen; the pressure can fall at once. You need to be ready to open.'},
{t:'Open', how:'Long midline incision from xiphoid to pubic symphysis.', why:'Every quadrant must be reachable at once.'},
{t:'Evacuate and eviscerate', how:'Scoop out blood and clot. Eviscerate the small bowel. Close any obvious hole with a soft clamp or a quick stitch.', why:'Clot hides the source; contamination keeps spreading while you look for it.'},
{t:'Pack four quadrants', how:'Large packs above and below the liver, behind and around the spleen, in both paracolic gutters and in the pelvis. Stop and let the anaesthetist catch up.', why:'Packing tamponades most bleeding and turns a frantic search into an orderly one.', tip:'Pack the liver by pushing it back into shape, front to back. Do not stuff packs into the laceration.'},
{t:'Unpack in order', how:'Remove packs one quadrant at a time, starting where bleeding is least likely. Treat in order of lethality: major vessels, solid organs, mesentery and hollow viscus, then contamination.', why:'Taking out all packs at once undoes the tamponade everywhere.'},
{t:'Liver', how:'Perihepatic packing. Pringle manoeuvre: clamp the hepatoduodenal ligament through the foramen of Winslow and record the time. Suture or clip accessible bleeders; leave deep lacerations packed.', why:'Pringle controls inflow. Bleeding that continues despite it comes from the hepatic veins or retrohepatic cava, or from an aberrant left hepatic artery. Pack and call; do not mobilise the liver.'},
{t:'Spleen', how:'In an unstable patient, splenectomy: divide the lienorenal ligament, deliver the spleen, clamp and ligate the hilum away from the pancreatic tail.', why:'WSES: non-operative management is contraindicated in instability. Splenic salvage is for the stable patient.'},
{t:'Bowel', how:'Staple off perforations or resect damaged segments with linear staplers. Leave the bowel in discontinuity. No anastomosis or stoma at this stage.', why:'Contamination control in minutes. Reconstruction waits for a warm, resuscitated patient.'},
{t:'Retroperitoneum', how:'Central (zone 1) haematoma: explore with proximal control. Lateral (zone 2): explore if expanding, pulsatile or penetrating. Pelvic (zone 3) after blunt injury: do not open; pack preperitoneally, embolise and fix the pelvis.', why:'Opening a contained pelvic haematoma releases the tamponade on bleeding you cannot control.'},
{t:'Look for what you missed', how:'Systematically: stomach front and back through the lesser sac, duodenum with a Kocher manoeuvre, small bowel DJ to ileocaecal valve on both borders, colon, rectum, both diaphragms.', why:'Posterior gastric, duodenal and mesenteric-border injuries are the classic misses.'},
{t:'Decide: damage control or definitive', how:'Damage control if the patient is cold, acidotic or coagulopathic, has had a massive transfusion, has injuries that need long repairs, or the abdomen will not close.', why:'Trying to finish everything in a patient sliding into the lethal triad kills them.'},
{t:'Temporary closure', how:'Negative pressure temporary abdominal closure. Count and record every pack left in. To ICU, with a relook planned within 24–48 hours.', why:'WSES (1B): negative pressure with fascial traction gives the best chance of later fascial closure.'}
],
house:[
['Blood products','1:1:1, massive transfusion protocol','PROPPR: no difference in 24-hour or 30-day mortality, but fewer deaths from exsanguination at 24 hours (9.2% against 14.6%) and more patients achieved haemostasis (86.1% against 78.1%).'],
['Tranexamic acid','1 g within 3 hours, then infusion','CRASH-2: all-cause death 14.5% against 16.0%. Benefit only when given within 3 hours of injury.'],
['Damage control triggers','Lethal triad, complex injuries, abdomen will not close','WSES 2021: indications from systematic review and expert consensus; physiology and injury pattern together.'],
['Temporary closure','Negative pressure','WSES open abdomen 2018 (1B): negative pressure with continuous fascial traction; avoid a Bogota bag where negative pressure is available.'],
['Relook','24–48 hours','WSES open abdomen 2018: re-explore no later than 24–48 hours.'],
['Spleen, unstable','Splenectomy','WSES spleen 2017: instability is a contraindication to non-operative management.'],
['Liver, unstable','Packing, Pringle, embolisation for arterial bleeding','WSES liver 2020: damage control with perihepatic packing; angioembolisation as an adjunct.']
],

anatomy:{
points:[
'Packing spaces: right subphrenic and subhepatic (around the liver), left subphrenic (around the spleen), both paracolic gutters, and the pelvis.',
'Pringle manoeuvre: the hepatoduodenal ligament carries the portal vein, hepatic artery and bile duct. A finger through the foramen of Winslow (epiploic foramen) passes behind it for a clamp or sling.',
'Bleeding despite Pringle: from the hepatic veins or the retrohepatic cava, or from an aberrant left hepatic artery arising from the left gastric artery in the lesser omentum.',
'Medial visceral rotation: right (Cattell–Braasch) mobilises the right colon and duodenum to expose the cava and right kidney; left (Mattox) mobilises the left colon, spleen and pancreatic tail to expose the aorta and its branches.',
'Supracoeliac aortic control: through the lesser omentum, compress the aorta against the spine at the hiatus with a hand or an aortic compressor.',
'Spleen: held by the lienorenal and gastrosplenic ligaments; the pancreatic tail lies in the hilum.'
],
table:{title:'Retroperitoneal haematoma: when to explore', head:['Zone','Contents','Blunt','Penetrating'], rows:[
['1 Central','Aorta, cava, coeliac and SMA, pancreas, duodenum','Explore','Explore'],
['2 Lateral','Kidney, adrenal, colon','Explore if expanding or pulsatile','Explore'],
['3 Pelvic','Iliac vessels','Do not open: pack, embolise, fix the pelvis','Explore with proximal control']
]},
danger:[
'Induction: loss of tamponade and cardiovascular collapse.',
'A contained pelvic haematoma in blunt trauma: opening it releases uncontrollable venous bleeding.',
'Retrohepatic cava and hepatic veins: mobilising the liver to chase them turns a packed injury into a fatal one.',
'Pancreatic tail at the splenic hilum.',
'Closing the abdomen under tension: abdominal compartment syndrome.'
]
},

pitfalls:[
{t:'Collapse on induction', a:'Prep and drape first; surgeon scrubbed; blood running.', r:'Open immediately and pack. Supracoeliac aortic compression if the pressure does not recover.'},
{t:'Liver still bleeding after Pringle', a:'Do not mobilise the liver to look.', r:'Repack firmly, keep Pringle while you think, and call. Consider angioembolisation after packing; check for an aberrant left hepatic artery.'},
{t:'Diffuse ooze everywhere', a:'Recognise coagulopathy, not surgical bleeding.', r:'Stop operating. Pack, temporary closure, ICU, correct coagulopathy and temperature, relook.'},
{t:'Hypotension on closing', a:'Expect it in a tight abdomen.', r:'Deon’s order: ventilation first (tension pneumothorax, missed haemothorax), then circulation (ongoing bleeding, volume), then relaxation. Raised pressure on closure: leave it open.'},
{t:'Missed injury', a:'Systematic survey before leaving.', r:'Tertiary survey within 24 hours; any deterioration means a relook rather than more imaging.'},
{t:'Bleeding from a pelvic fracture', a:'Do not open a pelvic haematoma after blunt injury.', r:'Preperitoneal pelvic packing, angioembolisation and external fixation, with orthopaedics and radiology.'}
],

viva:[
['What is damage control, and what are its stages?','A strategy of abbreviated surgery for patients whose physiology will not survive a definitive operation. Damage control resuscitation from the start; damage control laparotomy to stop bleeding and contamination; correction of the lethal triad in ICU over 24–48 hours; planned relook for definitive repair; then abdominal closure.'],
['What is the lethal triad?','Hypothermia, acidosis and coagulopathy. Each worsens the others: cold slows the clotting cascade, acidosis impairs it further, and coagulopathy prolongs bleeding and the operation. Recognising it early is the indication to stop.'],
['What is the evidence for 1:1:1?','PROPPR randomised 680 patients: 24-hour and 30-day mortality did not differ significantly, but exsanguination deaths at 24 hours fell from 14.6% to 9.2% and more patients achieved haemostasis (86.1% against 78.1%), with no increase in complications.'],
['When is tranexamic acid given?','Within 3 hours of injury: 1 g over 10 minutes, then 1 g over 8 hours. CRASH-2 reduced all-cause death from 16.0% to 14.5%. Given after 3 hours, it increased bleeding deaths.'],
['The liver still bleeds after packing and Pringle. What now?','Think of the hepatic veins and retrohepatic cava, or an aberrant left hepatic artery. Repack firmly, close temporarily and send for angioembolisation if arterial. Mobilising the liver to find the source releases the tamponade. Total vascular exclusion and atriocaval shunts belong to specialist centres and have poor results.'],
['Define abdominal compartment syndrome.','Sustained intra-abdominal pressure above 20 mmHg with new organ dysfunction (World Society of the Abdominal Compartment Syndrome). Measured through the bladder. Treat by decompression: open the abdomen, or do not close it.'],
['What does a splenectomy patient need before going home?','Vaccination against pneumococcus, Haemophilus influenzae type b and meningococcus, ideally two weeks after an emergency splenectomy or before discharge if follow-up is uncertain; annual influenza vaccine; antibiotic prophylaxis or a standby course; an alert card. Overwhelming post-splenectomy infection is rare but often fatal.']
],

const noteHTML=t=>t.split('\n').map(l=>l.trim()===''?'<span class="gap"></span>':`<span class="l">${esc(l).replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>').replace(/\{\{(.+?)\}\}/g,'<span class="sf">$1</span>')}</span>`).join('');
const noteText=t=>t.replace(/\[\[|\]\]|\{\{|\}\}/g,'');
const srcs=a=>a&&a.length?`<details class="acc src"><summary><span>Sources (${mono(a.length)})</span>${ic('caret-down','sm')}</summary><div class="acc-body"><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></div></details>`:'';
const NOTES={};
function noteBlock(title,text,bare){const k='n'+Object.keys(NOTES).length;NOTES[k]=noteText(text);return `<div class="notehd"${bare?' style="margin-top:0"':''}>${bare?'<span class="caption">Replacement lines</span>':`<h4>${esc(title)}</h4>`}<button class="btn btn-ghost sm" data-copy="${k}">${ic('copy','sm')}Copy</button></div><div class="notebox">${noteHTML(text)}</div>`;}
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DISC='<p class="disclaimer">Decision support only — verify against local protocols. No patient-identifiable data.</p>';

/* ── teams: codes, names and order; colours live in app.css (.team-XXX) ── */
const TEAMS=[['EGI','Upper GI'],['CRS','Colorectal and anorectal'],['HBP','Hepatobiliary'],['BRS','Breast'],['ECS','Endocrine'],['GEN','General']];
const TEAM=Object.fromEntries(TEAMS);
const code=(t,c='')=>`<span class="code team-${t} ${c}" aria-label="${esc(TEAM[t]||t)}">${t}</span>`;

/* ── state ── */
let filter=store.get('atlas-list')||'all', query='';
let origin={href:'#library',label:'Library',nav:'library'};
const LIST={emergency:'Emergency',elective:'Elective',both:'Elective and emergency'};
const SECTIONS=[['steps','Steps'],['anatomy','Anatomy'],['pitfalls','Pitfalls'],['setup','Set-up'],['consent','Consent'],['viva','Viva'],['notes','Post-op note']];
const inList=p=>filter==='all'||p.list===filter||p.list==='both';
const byTeam=(a,b)=>TEAMS.findIndex(t=>t[0]===a.team)-TEAMS.findIndex(t=>t[0]===b.team);

/* ── shell ── */
function chrome(nav,back,title){
  const b=$('#back');
  if(back){b.hidden=false;b.href=back.href;$('#backl').textContent=back.label;$('#brand').hidden=true;}
  else{b.hidden=true;$('#brand').hidden=false;}
  $$('[data-nav]').forEach(a=>{const on=a.dataset.nav===nav;a.classList.toggle('active',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});
  document.title=title?title+' — HST Atlas':'HST Atlas — EDB';
}
function seg(){
  return `<div class="segmented full" role="group" aria-label="List">${[['all','All'],['emergency','Emergency'],['elective','Elective']].map(([k,l])=>`<button data-list="${k}" class="${filter===k?'active':''}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div>`;
}
function wireSeg(redraw){
  $$('[data-list]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.list;store.set('atlas-list',filter);$$('[data-list]').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',on)});redraw();}));
}
const orow=(p,team)=>`<a class="orow" href="#p/${p.id}">${team?code(p.team,'sm'):''}<span class="tx"><span class="nm">${esc(p.name)}</span>${p.depth==='ref'?'<span class="mt">Reference entry</span>':''}</span>${ic('caret-right','sm')}</a>`;
const matches=(p,q)=>(p.name+' '+(p.aka||'')+' '+p.team+' '+(TEAM[p.team]||'')).toLowerCase().includes(q);

/* ── library ── */
function library(){
  origin={href:'#library',label:'Library',nav:'library'};
  chrome('library',null);
  $('#app').innerHTML=`<div class="ttl"><h1>Atlas</h1><p class="sub">${plural(P.length,'operation')} in ${mono(TEAMS.length)} teams</p></div>
  <div class="searchrow">${ic('magnifying-glass')}<input class="input" id="q" type="search" placeholder="Search ${P.length} operations" aria-label="Search operations" value="${esc(query)}"></div>
  ${seg()}<div id="lib"></div>`;
  $('#q').addEventListener('input',e=>{query=e.target.value;libBody();});
  wireSeg(libBody); libBody();
}
function libBody(){
  const q=query.trim().toLowerCase();
  if(q){
    const hits=P.filter(p=>inList(p)&&matches(p,q)).sort(byTeam);
    $('#lib').innerHTML=hits.length?`<div class="rows">${hits.map(p=>orow(p,true)).join('')}</div>`:`<div class="empty"><p>No operation matches “${esc(query.trim())}”. Try another name, or switch the list to All.</p></div>`;
    return;
  }
  $('#lib').innerHTML=`<div class="tiles">${TEAMS.map(([t,name])=>{
    const all=P.filter(p=>p.team===t), n=all.filter(inList).length;
    const ct=!all.length?'No pages yet':n?plural(n,'page'):'None on this list';
    return `<a class="tile team-${t}" href="#team/${t}" aria-label="${esc(name)}, ${n} ${n===1?'page':'pages'}"><span class="top"><span class="code">${t}</span>${ORG[t]||''}</span><span class="bot"><span class="nm">${esc(name)}</span><span class="ct">${ct}</span></span></a>`;}).join('')}</div>`;
}

/* ── one team ── */
function team(t){
  origin={href:'#team/'+t,label:TEAM[t],nav:'library'};
  chrome('library',{href:'#library',label:'Library'},TEAM[t]);
  const all=P.filter(p=>p.team===t);
  $('#app').innerHTML=`<div class="ttl"><div class="ctx">${code(t,'sm')}<span>${all.length?plural(all.length,'page'):'No pages yet'}</span></div><h1>${esc(TEAM[t])}</h1></div>${all.length?seg():''}<div id="tl"></div>`;
  const draw=()=>{const ps=all.filter(inList);
    $('#tl').innerHTML=ps.length?`<div class="rows">${ps.map(p=>orow(p)).join('')}</div>`:`<div class="empty"><p>${all.length?'Nothing on this list for this team. Switch the list to All.':'This team has no pages yet. They come in a later batch.'}</p>${all.length?'':'<a class="btn btn-ghost" href="#library">Back to the library</a>'}</div>`;};
  wireSeg(draw); draw();
}

/* ── on call ── */
function oncall(){
  origin={href:'#oncall',label:'On call',nav:'oncall'};
  chrome('oncall',null,'On call');
  const ps=P.filter(p=>p.list==='emergency'||p.list==='both').sort(byTeam);
  $('#app').innerHTML=`<div class="ttl"><h1>On call</h1><p class="sub">${plural(ps.length,'emergency operation')}</p></div>
  <div class="otiles">${ps.map(p=>`<a class="otile" href="#p/${p.id}">${code(p.team,'sm')}<span class="nm">${esc(p.name)}</span></a>`).join('')}</div>`;
}

/* ── conditions (not built yet) ── */
function conditions(){
  origin={href:'#conditions',label:'Conditions',nav:'conditions'};
  chrome('conditions',null,'Conditions');
  $('#app').innerHTML=`<div class="ttl"><h1>Conditions</h1></div><div class="empty"><p>Browsing by condition is not built yet. It will start from the diagnosis and lead to the operation.</p><a class="btn btn-ghost" href="#library">Open the library</a></div>`;
}

/* ── search ── */
function search(){
  origin={href:'#search',label:'Search',nav:'search'};
  chrome('search',null,'Search');
  $('#app').innerHTML=`<div class="ttl"><h1>Search</h1></div>
  <div class="searchrow">${ic('magnifying-glass')}<input class="input" id="sq" type="search" placeholder="Name, eponym or short form" aria-label="Search operations" value="${esc(query)}"></div><div id="sr"></div>`;
  const draw=()=>{const q=query.trim().toLowerCase();
    if(!q){const az=[...P].sort((a,b)=>a.name.localeCompare(b.name));let h='',L='';
      az.forEach(p=>{const l=p.name[0].toUpperCase();if(l!==L){if(L)h+='</div>';h+=`<p class="az">${l}</p><div class="rows">`;L=l;}h+=orow(p,true);});
      $('#sr').innerHTML=h+'</div>';return;}
    const hits=P.filter(p=>matches(p,q)).sort(byTeam);
    $('#sr').innerHTML=hits.length?`<div class="rows">${hits.map(p=>orow(p,true)).join('')}</div>`:`<div class="empty"><p>No operation matches “${esc(query.trim())}”. Try another name or a short form.</p></div>`;};
  $('#sq').addEventListener('input',e=>{query=e.target.value;draw();});
  draw();
  if(!matchMedia('(pointer:coarse)').matches) $('#sq').focus();
}

/* ── suggest a correction ── */
const REPO='https://github.com/Erniedabernie/SurgeryAtlas';
function fix(p,part){
  const title=`${p.name} · ${part}: `;
  const body=`**Page:** ${p.name}\n**Part:** ${part}\n**Version:** ${p.status}\n\n**What is wrong:**\n\n\n**What it should say:**\n\n\n**Source, if any:**\n`;
  return `<a class="fix" href="${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}" target="_blank" rel="noopener">${ic('pencil-simple','sm')}Suggest a correction to ${esc(part.toLowerCase())}</a>`;
}

/* ── procedure sections ── */
function section(p,k){
  const s=p.sources||{};
  if(k==='steps') return `${p.steps.map((x,i)=>`<details class="stp"><summary><span class="no mono">${i+1}</span><span class="st">${esc(x.t)}</span>${ic('caret-down','sm')}</summary><div class="more"><p>${esc(x.how)}</p><p class="why"><b>Why</b> · ${esc(x.why)}</p>${x.tip?`<p class="why"><b>Tip</b> · ${esc(x.tip)}</p>`:''}</div></details>`).join('')}
  <details class="acc" style="margin-top:var(--space-6)"><summary>${esc(p.houseTitle||'House and evidence')}${ic('caret-down','sm')}</summary><div class="acc-body"><p style="margin:0 0 var(--space-2)">${esc(p.houseLead||'Do it the consultant’s way. Know what the guideline says when asked.')}</p><div class="table-wrap"><table class="t"><thead><tr>${(p.houseHead||['Step','House','Guideline']).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${p.house.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${num(r[2])}</td></tr>`).join('')}</tbody></table></div></div></details>${srcs(s.steps)}`;
  if(k==='anatomy'){const a=p.anatomy,T=a.table;
    return `${p.dg&&p.dg.anat||''}${lines(a.points)}
    ${T?`<h3>${esc(T.title)}</h3><div class="table-wrap"><table class="t"><thead><tr>${T.head.map((h,i)=>`<th${T.num!=null&&i===T.num?' class="n"':''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${T.rows.map(r=>`<tr>${r.map((c,i)=>`<td${T.num!=null&&i===T.num?' class="n"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
    <h3>Danger zones</h3>${ul(a.danger)}${srcs(s.anatomy)}`;}
  if(k==='pitfalls') return `${p.pitfalls.map(x=>`<details class="stp"><summary><span class="st">${esc(x.t)}${x.u?`<span class="unc uncw">${esc(x.u)}</span>`:''}</span>${ic('caret-down','sm')}</summary><div class="more" style="padding-left:0"><p class="why"><b>Avoid</b> · ${esc(x.a)}</p><p class="why"><b>Rescue</b> · ${num(x.r)}</p></div></details>`).join('')}
    <h3>Stop and call</h3>${ul(p.call)}${srcs(s.pitfalls)}`;
  if(k==='setup'){const u=p.setup;
    return `${p.dg&&p.dg.setup||''}<h3>Theatre</h3>${ul(u.theatre)}<h3>Ask for</h3>${ul(u.kit)}<h3>Have in the room</h3>${ul(u.standby)}${srcs(s.setup)}`;}
  if(k==='consent'){const c=p.consent;
    return `<p class="legend"><span class="hl">Shaded</span> text changes with the patient. Type it into CMS as the record of what you discussed.</p>${noteBlock('Consent discussion',c.note)}
    <h3>Figures to quote</h3><div class="table-wrap"><table class="t"><thead><tr><th>Risk</th><th class="n">Rate</th><th>Source</th></tr></thead><tbody>${c.figures.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>${c.versus?`<p class="kv">${num(c.versus)}</p>`:''}${srcs(s.consent)}`;}
  if(k==='viva') return `${p.viva.map(v=>`<details class="acc qa"><summary>${esc(v[0])}${ic('caret-down','sm')}</summary><div class="acc-body">${num(v[1])}${v[2]?` <span class="unc">· ${esc(v[2])}</span>`:''}</div></details>`).join('')}${srcs(s.viva)}`;
  if(k==='notes'){const n=p.notes;
    return `<p class="legend"><span class="hl">Shaded</span>: amend to the case. <span class="sf">Dotted underline</span>: a safety claim, true only if you did it.</p>
    ${noteBlock('Findings',n.findings)}${noteBlock('Procedure record',n.procedure)}
    <h3>Decision lines</h3>${n.decisions.map(d=>noteBlock(d[0],d[1])).join('')}
    <h3>When it did not go to plan</h3><p class="legend">Replace the matching lines of the record: what happened, what you did, who came.</p>${n.deviations.map(d=>`<details class="acc"><summary>${esc(d[0])}${ic('caret-down','sm')}</summary><div class="acc-body" style="color:var(--text)">${noteBlock(d[0],d[1],true)}</div></details>`).join('')}
    <h3>Orders</h3>${noteBlock('Post-op orders',n.postop)}${noteBlock('Discharge and follow-up',n.discharge)}${srcs(s.notes)}`;}
  return '';
}
function meta(p,k){
  if(k==='steps') return plural(p.steps.length,'step');
  if(k==='anatomy') return p.anatomy.table?esc(p.anatomy.table.title):plural(p.anatomy.points.length,'point');
  if(k==='pitfalls') return `${plural(p.pitfalls.length,'problem')} and when to call`;
  if(k==='setup') return 'Position, kit and standby';
  if(k==='consent') return `${plural(p.consent.figures.length,'figure')} to quote`;
  if(k==='viva') return plural(p.viva.length,'question');
  return 'After the case: amend, then type into CMS';
}

/* ── procedure: contents first, then a page per section ── */
function contents(p){
  chrome(origin.nav,{href:origin.href,label:origin.label},p.name);
  $('#app').innerHTML=`<div class="ttl"><div class="ctx">${code(p.team,'sm')}<span>${LIST[p.list]} · ${esc(p.approach)}</span></div><h1>${esc(p.name)}</h1></div>
  <nav class="rows" aria-label="Sections">${SECTIONS.map(([k,l])=>`<a class="crow" href="#p/${p.id}/${k}"><span class="tx"><span class="nm">${l}</span><span class="mt">${meta(p,k)}</span></span>${ic('caret-right','sm')}</a>`).join('')}</nav>
  <p class="status">${num(p.status)}</p>${DISC}`;
}
function sectionPage(p,k){
  const l=(SECTIONS.find(x=>x[0]===k)||[])[1]; if(!l){location.replace('#p/'+p.id);return;}
  for(const x in NOTES) delete NOTES[x];
  chrome(origin.nav,{href:'#p/'+p.id,label:'Contents'},l+' · '+p.name);
  $('#app').innerHTML=`<div class="ttl"><div class="ctx">${code(p.team,'sm')}<span>${esc(p.name)}</span></div><h1>${l}</h1></div>
  <div class="pane">${section(p,k)}${fix(p,l)}</div>${DISC}`;
}
/* reference entry: one page, no consent or note */
function refPage(p){
  chrome(origin.nav,{href:origin.href,label:origin.label},p.name);
  $('#app').innerHTML=`<div class="ttl"><div class="ctx">${code(p.team,'sm')}<span>Reference · ${esc(p.approach)}</span></div><h1>${esc(p.name)}</h1></div>
  <div class="pane"><p class="what">${esc(p.what)}</p>
  <h3>When it is used</h3>${ul(p.when)}
  <h3>Outline</h3><ol class="outline">${p.outline.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
  ${p.dg&&p.dg.ref?`<h3>Diagram</h3>${p.dg.ref}`:''}
  <h3>What matters</h3>${ul(p.points)}
  <h3>Viva</h3>${p.viva.map(v=>`<details class="acc qa"><summary>${esc(v[0])}${ic('caret-down','sm')}</summary><div class="acc-body">${num(v[1])}${v[2]?` <span class="unc">· ${esc(v[2])}</span>`:''}</div></details>`).join('')}
  ${srcs(p.sources)}${fix(p,'Reference entry')}<p class="status">${num(p.status)}</p></div>${DISC}`;
}

/* ── copy, toast ── */
let tt;
function toast(msg,kind){$$('.toast').forEach(x=>x.remove());const el=document.createElement('div');el.className='toast '+(kind||'');el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);clearTimeout(tt);tt=setTimeout(()=>el.remove(),3500);}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]'); if(!b) return;
  const text=NOTES[b.dataset.copy]||'', fail=()=>toast('Copy was blocked here. Press and hold the text to select it.','warn');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast('Copied without the markers.','ok'),fail); else fail(); }catch(err){ fail(); }
});

/* ── router: #library · #team/EGI · #oncall · #conditions · #search · #p/<id> · #p/<id>/<section> ── */
function route(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,'')), parts=h.split('/');
  const old=P.find(x=>x.id===h); if(old){location.replace('#p/'+old.id);return;}
  if(parts[0]==='p'){const p=P.find(x=>x.id===parts[1]);
    if(p){ if(p.depth==='ref') refPage(p); else if(parts[2]) sectionPage(p,parts[2]); else contents(p); }
    else { library(); }
  }
  else if(parts[0]==='team'&&TEAM[parts[1]]) team(parts[1]);
  else if(h==='oncall') oncall();
  else if(h==='conditions') conditions();
  else if(h==='search') search();
  else library();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ── settings menu and theme ── */
const gear=$('#gear'), menu=$('#menu');
function setMenu(o){menu.hidden=!o;gear.setAttribute('aria-expanded',String(o));}
gear.addEventListener('click',e=>{e.stopPropagation();setMenu(menu.hidden);});
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target))setMenu(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){setMenu(false);gear.focus();}});
function mode(){const t=document.documentElement.getAttribute('data-theme');return t==='light'||t==='dark'?t:'system';}
function paintMode(){const m=mode();$$('.menu .segmented button').forEach(b=>{const on=b.dataset.mode===m;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});}
$$('.menu .segmented button').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.mode;if(m==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m);try{localStorage.setItem('edb-theme',m)}catch(e){}paintMode();}));
paintMode(); route();
</script>
</body>
</html>
